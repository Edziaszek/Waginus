<div class="subtabs-nav" id="settingsNav">
  <button class="subtab-btn active" data-sub="weight">Waga</button>
  <button class="subtab-btn" data-sub="workout">Treningi</button>
  <button class="subtab-btn" data-sub="cardio">Kardio</button>
  <button class="subtab-btn" data-sub="body">Obwody</button>
  <button class="subtab-btn" data-sub="general">Ogólne</button>
</div>

<div class="subtab-content active" data-panel="weight">
  <div class="card"><h2>Edycja wpisów wagi</h2><div id="editWeightList" class="edit-list"></div></div>
</div>

<div class="subtab-content" data-panel="workout">
  <div class="card">
    <h2>Nazwy Ćwiczeń (Baza)</h2>
    <div class="form-group">
      <input type="text" id="newExerciseInput" placeholder="Nowe ćwiczenie">
      <button type="button" class="btn-primary" data-act="add-exercise">Dodaj</button>
    </div>
    <div id="editExercisesList" class="edit-list mt"></div>
  </div>
  <div class="card"><h2>Edycja Treningów</h2><div id="editWorkoutList" class="edit-list"></div></div>
</div>

<div class="subtab-content" data-panel="cardio">
  <div class="card">
    <h2>Rodzaje Aktywności (Baza)</h2>
    <div class="form-group">
      <input type="text" id="newCardioTypeInput" placeholder="Nowy rodzaj (np. Bieżnia)">
      <button type="button" class="btn-primary" data-act="add-ctype">Dodaj</button>
    </div>
    <div id="editCardioTypesList" class="edit-list mt"></div>
  </div>
  <div class="card"><h2>Edycja Kardio</h2><div id="editCardioList" class="edit-list"></div></div>
</div>

<div class="subtab-content" data-panel="body">
  <div class="card">
    <h2>Nazwy Obwodów (Baza)</h2>
    <div class="form-group">
      <input type="text" id="newBodyPartInput" placeholder="Nowy obwód">
      <button type="button" class="btn-primary" data-act="add-part">Dodaj</button>
    </div>
    <div id="editBodyPartsList" class="edit-list mt"></div>
  </div>
  <div class="card"><h2>Edycja Pomiarów Obwodów</h2><div id="editBodyList" class="edit-list"></div></div>
</div>

<div class="subtab-content" data-panel="general">
  <div class="card">
    <h2>Wygląd Aplikacji</h2>
    <button class="btn-secondary full" data-act="theme">Przełącz Motyw (Jasny/Ciemny)</button>
    <div class="form-group mt">
      <button class="btn-secondary" style="flex:1" data-act="font" data-d="-1">Tekst A-</button>
      <button class="btn-secondary" style="flex:1" data-act="font" data-d="1">Tekst A+</button>
    </div>
  </div>
  <div class="card">
    <h2>Twój wzrost (do obliczania BMI)</h2>
    <div class="form-field">
      <label>Wzrost w centymetrach</label>
      <div class="unit-field"><input type="number" id="heightInput" min="100" max="250" step="1" inputmode="numeric" placeholder="np. 178"><i>cm</i></div>
    </div>
    <button class="btn-primary full mt" data-act="save-height">Zapisz wzrost</button>
  </div>
  <div class="card">
    <h2>Zabezpieczenie PIN</h2>
    <div class="form-field">
      <label>Nowy PIN (domyślnie 1234)</label>
      <input type="password" id="newPinInput" inputmode="numeric" placeholder="Wpisz 4 cyfry" maxlength="4">
    </div>
    <button class="btn-primary full mt" data-act="pin">Zapisz nowy PIN</button>
    <button class="btn-danger full mt" data-act="logout">Wyloguj z sesji</button>
  </div>
</div>

<script>
(() => {
  const { util: U, data: D } = App;
  const $ = id => document.getElementById(id);
  const root = $('tab-settings');
  const state = { sub: 'weight' };

  // rodzaj wpisu -> kolekcja Firestore + lista w App.data
  const KINDS = {
    weight:   { coll: 'Waga',      list: () => D.weight },
    workout:  { coll: 'Treningi',  list: () => D.workouts },
    cardio:   { coll: 'Kardio',    list: () => D.cardio },
    body:     { coll: 'Obwody',    list: () => D.body },
    exercise: { coll: 'Cwiczenia', list: () => D.exercises }
  };

  const ctl = (kind, id) => `<div class="btn-row">
    <button class="btn-secondary" data-act="toggle" data-kind="${kind}" data-id="${id}">Edytuj</button>
    <button class="btn-danger" data-act="delete" data-kind="${kind}" data-id="${id}">Usuń</button></div>`;
  const item = (kind, r, label, fields) => `
    <div class="edit-item col">
      <div class="between"><span>${label}</span>${ctl(kind, r.id ?? '')}</div>
      <div class="edit-panel" id="edit-${kind}-${r.id}" hidden>${fields}
        <button class="btn-primary" data-act="save" data-kind="${kind}" data-id="${r.id ?? ''}">Zapisz zmianę</button>
      </div>
    </div>`;
  const field = (name, type, value, label = '', extra = '') =>
    `<div class="form-field">${label ? `<label>${label}</label>` : ''}<input type="${type}" data-f="${name}" value="${U.esc(value)}" ${extra}></div>`;

  // Listy renderujemy tylko dla aktualnie otwartej podzakładki
  const renderers = {
    weight() {
      $('editWeightList').innerHTML = [...D.weight].reverse().map(r => item('weight', r,
        `${U.fmtDate(r.date)}: <strong>${r.weight} kg</strong>`,
        field('date', 'date', U.iso(r.ts)) + field('weight', 'number', r.weight, '', 'step="0.1"'))).join('');
    },
    workout() {
      $('editExercisesList').innerHTML = D.exercises.map(e => `<div class="edit-item"><span>${U.esc(e.name)}</span>
        <button class="btn-danger" data-act="delete" data-kind="exercise" data-id="${e.id}">Usuń</button></div>`).join('');
      $('editWorkoutList').innerHTML = [...D.workouts].reverse().map(r => item('workout', r,
        `${U.fmtDate(r.date)} - <strong>${U.esc(r.exercise)}</strong>`,
        field('date', 'date', U.iso(r.ts), 'Data') +
        field('weights', 'text', r.weights.join(', '), 'Ciężary w seriach (np. 30, 32.5, 35)') +
        field('reps', 'text', r.reps.join(', '), 'Powtórzenia w seriach (np. 8, 8, 8)'))).join('');
    },
    cardio() {
      $('editCardioTypesList').innerHTML = D.cardioTypes.map(t => `<div class="edit-item"><span>${U.esc(t.name)}</span>
        <button class="btn-danger" data-act="delete-ctype" data-name="${U.esc(t.name)}">Usuń</button></div>`).join('');
      // lista rodzajów w edycji zawiera też rodzaj wpisu, który zniknął z bazy – żeby go nie zgubić przy zapisie
      const typeSelect = cur => {
        const names = [...new Set([...D.cardioTypes.map(t => t.name), cur])];
        return `<div class="form-field"><label>Rodzaj</label><select data-f="type">${names.map(n =>
          `<option value="${U.esc(n)}" ${n === cur ? 'selected' : ''}>${U.esc(n)}</option>`).join('')}</select></div>`;
      };
      $('editCardioList').innerHTML = [...D.cardio].reverse().map(r => item('cardio', r,
        `${U.fmtDate(r.date)} - <strong>${U.esc(r.type)}</strong>: ${r.distance} km`,
        field('date', 'date', U.iso(r.ts), 'Data') + typeSelect(r.type) +
        field('duration', 'text', r.duration, 'Czas (np. 45 min lub 1:15:00)') +
        field('distance', 'number', r.distance, 'Dystans (km)', 'step="0.01"') +
        field('pace', 'text', r.pace, 'Średnie tempo (min/km)') +
        field('hr', 'number', r.heartRate, 'Średnie tętno (bpm)', 'step="1"'))).join('');
    },
    body() {
      $('editBodyPartsList').innerHTML = D.bodyParts.map(p => `<div class="edit-item"><span>${U.esc(p.name)}</span>
        <button class="btn-danger" data-act="delete-part" data-name="${U.esc(p.name)}">Usuń</button></div>`).join('');
      $('editBodyList').innerHTML = [...D.body].reverse().map(r => item('body', r,
        `${U.fmtDate(r.date)} - <strong>${U.esc(r.part)}</strong>: ${r.size} cm`,
        field('date', 'date', U.iso(r.ts)) + field('size', 'number', r.size, '', 'step="0.1"'))).join('');
    },
    general() { $('heightInput').value = App.getHeight() ?? ''; }
  };

  // ---------- operacje na danych (lokalnie od razu, w bazie w tle, z cofnięciem przy błędzie) ----------
  async function patch(kind, rec, fields, dbFields) {
    const list = KINDS[kind].list(), old = { ...rec };
    Object.assign(rec, fields);
    list.sort(U.byTs);
    App.invalidate();
    await App.run(() => App.db.updateData(KINDS[kind].coll, rec.id, dbFields), () => { Object.assign(rec, old); list.sort(U.byTs); });
  }

  async function save(kind, id) {
    const rec = KINDS[kind].list().find(r => r.id === id), panel = $(`edit-${kind}-${id}`);
    if (!rec || !panel) return;
    const f = n => panel.querySelector(`[data-f="${n}"]`).value;
    const date = f('date'), ts = U.ts(date);
    if (!date || isNaN(ts)) return;

    if (kind === 'weight') {
      const weight = U.num(f('weight'));
      if (!isNaN(weight)) await patch(kind, rec, { date, ts, weight }, { Data: date, Waga: weight });
    } else if (kind === 'body') {
      const size = U.num(f('size'));
      if (!isNaN(size)) await patch(kind, rec, { date, ts, size }, { Data: date, Partia: rec.part, Wymiar: size });
    } else if (kind === 'cardio') {
      const type = f('type'), duration = f('duration').trim(), pace = f('pace').trim();
      const distance = U.num(f('distance')), heartRate = parseInt(f('hr')) || 0;
      if (!isNaN(distance)) await patch(kind, rec, { date, ts, type, duration, distance, pace, heartRate },
        { Data: date, Typ: type, Czas: duration, Dystans: distance, Tempo: pace, Tetno: heartRate });
    } else if (kind === 'workout') {
      const nums = (s, conv) => s.split(',').map(x => conv(x.trim().replace(',', '.'))).filter(n => !isNaN(n));
      const weights = nums(f('weights'), parseFloat), reps = nums(f('reps'), parseInt);
      if (weights.length) await patch(kind, rec, { date, ts, weights, reps, avgWeight: U.avg(weights) },
        { Data: date, Cwiczenie: rec.exercise, Serie: weights.length, Wagi: weights, Powtorzenia: reps });
    }
  }

  async function remove(kind, id) {
    if (!id || !confirm('Usunąć wpis?')) return;
    const list = KINDS[kind].list(), i = list.findIndex(r => r.id === id);
    if (i < 0) return;
    const [rec] = list.splice(i, 1);
    App.invalidate();
    await App.run(() => App.db.deleteData(KINDS[kind].coll, id), () => list.splice(i, 0, rec));
  }

  async function addExercise() {
    const inp = $('newExerciseInput'), name = inp.value.trim();
    if (!name) return;
    inp.value = '';
    const rec = { id: undefined, name };
    D.exercises.push(rec); App.invalidate();
    const id = await App.run(() => App.db.addData('Cwiczenia', { Nazwa: name }), () => U.drop(D.exercises, rec));
    if (id) rec.id = id;
  }

  // Lista domyślnych rodzajów (gdy baza jest pusta) istnieje tylko w pamięci – przed pierwszą zmianą zapisujemy ją w bazie,
  // inaczej po odświeżeniu zniknęłaby i został tylko nowo dodany rodzaj.
  async function materializeTypes() {
    for (const t of D.cardioTypes.filter(t => String(t.id).startsWith('default_'))) {
      t.id = await App.db.addData('KardioTypy', { Nazwa: t.name });
    }
  }

  async function addCardioType() {
    const inp = $('newCardioTypeInput'), name = inp.value.trim();
    if (!name) return;
    if (D.cardioTypes.some(t => t.name.toLowerCase() === name.toLowerCase())) { alert('Taki rodzaj już istnieje.'); return; }
    inp.value = '';
    const rec = { id: undefined, name };
    D.cardioTypes.push(rec); App.invalidate();
    const id = await App.run(async () => { await materializeTypes(); return App.db.addData('KardioTypy', { Nazwa: name }); },
      () => U.drop(D.cardioTypes, rec));
    if (id) rec.id = id;
  }

  // Usuwa rodzaj z listy wyboru; istniejące wpisy kardio tego rodzaju zostają bez zmian.
  async function removeCardioType(name) {
    const i = D.cardioTypes.findIndex(t => t.name === name);
    if (i < 0 || !confirm(`Usunąć rodzaj „${name}” z listy? Dotychczasowe wpisy kardio zostaną.`)) return;
    const [rec] = D.cardioTypes.splice(i, 1);
    App.invalidate();
    await App.run(async () => {
      await materializeTypes(); // pozostałe domyślne zapisujemy w bazie, usuwany był tylko w pamięci
      if (!String(rec.id).startsWith('default_')) await App.db.deleteData('KardioTypy', rec.id);
    }, () => D.cardioTypes.splice(i, 0, rec));
  }

  async function addPart() {
    const inp = $('newBodyPartInput'), name = inp.value.trim();
    if (!name) return;
    if (D.bodyParts.some(p => p.name.toLowerCase() === name.toLowerCase())) { alert('Taki obwód już istnieje.'); return; }
    inp.value = '';
    const part = { id: 'part_' + Date.now(), name, docIds: [], legacyIds: [] };
    D.bodyParts.push(part); App.invalidate();
    const id = await App.run(() => App.db.addData('Obwody', { Partia: name, Wymiar: 0 }), () => U.drop(D.bodyParts, part));
    if (id) part.docIds.push(id);
  }

  // Usuwa definicję partii razem ze wszystkimi jej pomiarami (inaczej partia wróciłaby po odświeżeniu)
  async function removePart(name) {
    const part = D.bodyParts.find(p => p.name === name);
    if (!part || !confirm(`Usunąć obwód „${name}” wraz ze wszystkimi jego pomiarami?`)) return;
    const ok = await App.run(async () => {
      await Promise.all([
        ...part.docIds.map(id => App.db.deleteData('Obwody', id)),
        ...part.legacyIds.map(id => App.db.removeField('Cwiczenia', id, 'ObwodyBaza'))
      ]);
      return true;
    });
    if (!ok) return;
    U.drop(D.bodyParts, part);
    D.body = D.body.filter(b => b.part.toLowerCase() !== name.toLowerCase());
    App.invalidate();
  }

  function saveHeight() {
    const cm = U.num($('heightInput').value);
    if (!(cm >= 100 && cm <= 250)) { alert('Podaj wzrost w centymetrach (100–250).'); return; }
    App.setHeight(cm);
    alert('Wzrost został zapisany.');
  }

  function savePin() {
    const inp = $('newPinInput');
    if (!/^\d{4}$/.test(inp.value)) { alert('PIN musi składać się z 4 cyfr!'); return; }
    App.pinSave(inp.value);
    inp.value = '';
    alert('PIN został pomyślnie zmieniony.');
  }

  // ---------- zdarzenia: jedna delegacja na całą zakładkę ----------
  const actions = {
    toggle: d => { const p = $(`edit-${d.kind}-${d.id}`); if (p) p.hidden = !p.hidden; },
    save: d => d.id && save(d.kind, d.id),
    delete: d => remove(d.kind, d.id),
    'delete-part': d => removePart(d.name),
    'add-exercise': addExercise,
    'add-ctype': addCardioType,
    'delete-ctype': d => removeCardioType(d.name),
    'add-part': addPart,
    theme: () => App.toggleTheme(),
    font: d => App.changeFont(+d.d),
    'save-height': saveHeight,
    pin: savePin,
    logout: () => App.logout()
  };

  function showSub(sub) {
    state.sub = sub;
    root.querySelectorAll('.subtab-btn').forEach(b => b.classList.toggle('active', b.dataset.sub === sub));
    root.querySelectorAll('.subtab-content').forEach(p => p.classList.toggle('active', p.dataset.panel === sub));
    renderers[sub]();
  }

  function init() {
    root.addEventListener('click', e => {
      const sub = e.target.closest('[data-sub]');
      if (sub) return showSub(sub.dataset.sub);
      const el = e.target.closest('[data-act]');
      if (el) actions[el.dataset.act]?.(el.dataset);
    });
  }

  App.register('settings', { init, render: () => renderers[state.sub]() });
})();
</script>
