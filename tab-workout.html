<div class="card">
  <h2>🏋️ Dodaj Trening</h2>
  <form id="workoutForm">
    <div class="form-field"><label>Data</label><input type="date" id="workoutDate" required></div>
    <div class="form-field">
      <label>Ćwiczenie</label>
      <select id="exerciseSelect" required><option value="">Wybierz ćwiczenie...</option></select>
    </div>
    <div class="form-field"><label>Liczba serii</label><input type="number" id="seriesCount" min="1" max="10" value="3" required></div>
    <div id="seriesBox" class="series-grid"></div>
    <button type="submit" class="btn-primary">Zapisz Trening</button>
  </form>
</div>

<div class="card">
  <h2>📅 Kalendarz Treningów</h2>
  <div class="between" style="margin-bottom:10px">
    <button type="button" class="btn-secondary" data-nav="-1">◀ Poprzedni</button>
    <strong id="calendarTitle"></strong>
    <button type="button" class="btn-secondary" data-nav="1">Następny ▶</button>
  </div>
  <div class="calendar-head"><div>Pon</div><div>Wt</div><div>Śr</div><div>Czw</div><div>Pt</div><div>Sob</div><div>Ndz</div></div>
  <div id="calendarGrid" class="calendar-grid"></div>
  <div id="calendarInfo" class="calendar-info" hidden></div>
</div>

<div class="card">
  <h2>📊 Statystyki Treningowe</h2>
  <div class="form-field">
    <label>Wybierz ćwiczenie</label>
    <select id="statExerciseSelect"><option value="">Wybierz ćwiczenie...</option></select>
  </div>
  <div class="segmented" id="workoutFilterGroup" role="group" aria-label="Okres statystyk">
    <button type="button" class="active" aria-pressed="true" data-filter="week">Tydzień</button>
    <button type="button" aria-pressed="false" data-filter="month">Miesiąc</button>
    <button type="button" aria-pressed="false" data-filter="90">90 dni</button>
    <button type="button" aria-pressed="false" data-filter="all">Wszystko</button>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-lbl">Największy ciężar</div><div class="stat-val" id="workoutMax">-</div><div class="stat-sub" id="workoutMaxSub"></div></div>
    <div class="stat-box"><div class="stat-lbl">Najniższy ciężar</div><div class="stat-val" id="workoutMin">-</div><div class="stat-sub" id="workoutMinSub"></div></div>
  </div>
  <div class="chart-box"><canvas id="workoutChart"></canvas></div>
</div>

<div class="card">
  <h2>📜 Historia Treningów</h2>
  <div id="workoutHistory" class="history"></div>
</div>

<script>
(() => {
  const { util: U, data: D } = App;
  const $ = id => document.getElementById(id);
  const MONTHS = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
  const now = new Date();
  const state = { filter: 'week', cal: new Date(now.getFullYear(), now.getMonth(), 1), byDay: new Map() };

  const repsAt = (w, i) => w.reps[i] || 8;
  const setLine = (w, i) => `${w.weights[i]} kg x ${U.reps(repsAt(w, i))}`;

  // ---------- dane ----------
  function parse(raw) {
    D.exercises = raw.Cwiczenia
      .map(i => ({
        id: i.id, name: String(U.pick(i, 'Nazwa', 'Cwiczenie', 'exercise') ?? '').trim(),
        // mięśnie zapisane w bazie: główne (Miesnie) i pomocnicze (MiesnieDodatkowe)
        muscles: Array.isArray(i.Miesnie) ? i.Miesnie.filter(x => typeof x === 'string') : [],
        muscles2: Array.isArray(i.MiesnieDodatkowe) ? i.MiesnieDodatkowe.filter(x => typeof x === 'string') : [],
        created: Number(i.Dodano) || 0   // kiedy dodano ćwiczenie (sortowanie „od najnowszych”); starsze bez daty = 0
      }))
      .filter(e => e.name);

    // wartość może być tablicą, napisem "30, 32.5" albo liczbą
    const toList = (v, conv) => (Array.isArray(v) ? v : ['string', 'number'].includes(typeof v) ? String(v).split(',') : [])
      .map(x => conv(String(x).trim().replace(',', '.'))).filter(n => !isNaN(n));

    D.workouts = raw.Treningi.map(i => {
      const date = U.pick(i, 'Data', 'date') || '';
      const weights = toList(U.pick(i, 'Wagi', 'weights', 'Serie_Wagi'), parseFloat);
      return {
        id: i.id, date, ts: U.ts(date),
        exercise: String(U.pick(i, 'Cwiczenie', 'Nazwa', 'exercise') ?? ''),
        weights,
        reps: toList(U.pick(i, 'Powtorzenia', 'reps'), parseInt),
        avgWeight: U.num(U.pick(i, 'AvgWeight', 'Srednia')) || U.avg(weights) || 0
      };
    }).filter(r => r.date && r.exercise && !isNaN(r.ts)).sort(U.byTs);
  }

  // ---------- formularz serii ----------
  function fillSelects() {
    const opts = '<option value="">Wybierz ćwiczenie...</option>' +
      App.sorted('exercise', D.exercises).map(e => `<option value="${U.esc(e.name)}">${U.esc(e.name)}</option>`).join('');
    for (const id of ['exerciseSelect', 'statExerciseSelect']) {
      const el = $(id), cur = el.value;
      el.innerHTML = opts;
      el.value = cur;
      if (el.selectedIndex < 0) el.selectedIndex = 0;
      if (id === 'statExerciseSelect' && el.selectedIndex === 0 && D.exercises.length) el.selectedIndex = 1;
    }
  }

  function renderSeries(count, w = [], r = []) {
    $('seriesBox').innerHTML = Array.from({ length: count }, (_, i) => {
      const wv = w[i] ?? w[w.length - 1] ?? 30, rv = r[i] ?? r[r.length - 1] ?? 8;
      return `<div class="series-row">
        <span class="series-label">Seria ${i + 1}:</span>
        <div class="unit-field"><input type="number" class="s-w series-input" step="0.5" value="${wv}" required><i>kg</i></div>
        <div class="unit-field"><input type="number" class="s-r series-input" step="1" value="${rv}" required><i>powt.</i></div>
      </div>`;
    }).join('');
  }
  const readSeries = () => [...$('seriesBox').children].map(row => [row.querySelector('.s-w').value, row.querySelector('.s-r').value]);

  function onExerciseChange() {
    const name = $('exerciseSelect').value.toLowerCase();
    const last = name && D.workouts.findLast(w => w.exercise.toLowerCase() === name);
    if (last && last.weights.length) {
      $('seriesCount').value = last.weights.length;
      renderSeries(last.weights.length, last.weights, last.reps);
    }
  }

  function onCountChange() { // zachowuje już wpisane wartości
    const n = Math.min(10, Math.max(1, parseInt($('seriesCount').value) || 1)), cur = readSeries();
    renderSeries(n, cur.map(c => c[0]), cur.map(c => c[1]));
  }

  // ---------- statystyki i wykres ----------
  function sessions() {
    const name = $('statExerciseSelect').value.toLowerCase();
    if (!name) return [];
    const n = new Date(), f = state.filter;
    const from = f === 'week' ? U.daysAgo((n.getDay() || 7) - 1)
      : f === 'month' ? new Date(n.getFullYear(), n.getMonth(), 1).getTime()
      : f === '90' ? U.daysAgo(90) : 0;
    return D.workouts.filter(w => w.ts >= from && w.exercise.toLowerCase() === name && w.avgWeight > 0);
  }

  // Wykres treningowy: średni ciężar sesji, punkty równo rozłożone, wartości przy punktach (gdy jest ich mało)
  function drawChart(rows) {
    const canvas = $('workoutChart'), w = canvas.parentElement.clientWidth;
    if (!w) return;
    const h = 180, dpr = window.devicePixelRatio || 1, ctx = canvas.getContext('2d');
    canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    const c = { line: U.css('--primary'), muted: U.css('--text-muted'), grid: U.css('--card-border') };
    ctx.font = '11px sans-serif'; ctx.fillStyle = c.muted;
    if (rows.length < 2) { ctx.textAlign = 'center'; ctx.fillText('Za mało danych w okresie', w / 2, h / 2); return; }

    const vals = rows.map(r => r.avgWeight), lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const min = lo - span * .25, max = hi + span * .25, P = 24, T = 20, B = 24;
    const X = i => P + i / (vals.length - 1) * (w - 2 * P);
    const Y = v => T + (1 - (v - min) / (max - min)) * (h - T - B);

    ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(P, h - B); ctx.lineTo(w - P, h - B); ctx.stroke();

    ctx.strokeStyle = c.line; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    vals.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
    ctx.stroke();

    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    vals.forEach((v, i) => {
      ctx.fillStyle = v === hi ? '#16a34a' : c.line;   // rekord sesji na zielono
      ctx.beginPath(); ctx.arc(X(i), Y(v), v === hi ? 5 : 3.5, 0, 7); ctx.fill();
      if (vals.length <= 12) { ctx.fillStyle = c.muted; ctx.fillText(+v.toFixed(1), X(i), Y(v) - 8); }
    });

    ctx.fillStyle = c.muted; ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText(U.fmtDate(rows[0].date).slice(0, 5), P, h - B + 6);
    ctx.textAlign = 'right'; ctx.fillText(U.fmtDate(rows[rows.length - 1].date).slice(0, 5), w - P, h - B + 6);
  }

  // Najcięższa i najlżejsza seria (>0 kg) spośród wszystkich sesji z wybranego okresu
  function extremes(rows) {
    let max = null, min = null;
    for (const w of rows) w.weights.forEach((kg, i) => {
      if (kg <= 0) return;
      const hit = { kg, reps: repsAt(w, i) };
      if (!max || kg > max.kg) max = hit;
      if (!min || kg < min.kg) min = hit;
    });
    return { max, min };
  }

  function renderStats() {
    const rows = sessions(), { max, min } = extremes(rows);
    for (const [key, hit] of [['workoutMax', max], ['workoutMin', min]]) {
      $(key).textContent = hit ? `${hit.kg} kg` : '-';
      $(key + 'Sub').textContent = hit ? U.reps(hit.reps) : '';
    }
    drawChart(rows);
  }

  // ---------- kalendarz ----------
  function renderCalendar() {
    const y = state.cal.getFullYear(), m = state.cal.getMonth();
    $('calendarTitle').textContent = `${MONTHS[m]} ${y}`;
    state.byDay = U.group(D.workouts, w => U.iso(w.ts));
    const first = (new Date(y, m, 1).getDay() || 7) - 1, total = new Date(y, m + 1, 0).getDate(), today = U.iso(Date.now());
    let html = '<div class="calendar-day empty"></div>'.repeat(first);
    for (let d = 1; d <= total; d++) {
      const iso = U.iso(new Date(y, m, d).getTime()), cls = 'calendar-day' + (iso === today ? ' today' : '');
      html += state.byDay.has(iso)
        ? `<div class="${cls} workout-day" data-iso="${iso}"><span>${d}</span><span class="workout-badge">🏋️</span></div>`
        : `<div class="${cls}">${d}</div>`;
    }
    $('calendarGrid').innerHTML = html;
    $('calendarInfo').hidden = true;
  }

  function showDay(iso) {
    const items = state.byDay.get(iso) || [];
    $('calendarInfo').innerHTML = `<strong class="accent">📅 ${U.fmtDate(iso)}:</strong><ul>` +
      items.map(w => `<li><strong>${U.esc(w.exercise)}:</strong> ${w.weights.map((_, i) => setLine(w, i)).join(', ')}</li>`).join('') + '</ul>';
    $('calendarInfo').hidden = false;
  }

  // ---------- historia ----------
  function renderHistory() {
    const groups = [...U.group(D.workouts, w => U.fmtDate(w.date))].reverse();
    $('workoutHistory').innerHTML = groups.map(([dt, items], idx) => `
      <details class="accordion" ${idx === 0 ? 'open' : ''}>
        <summary><span>📅 ${dt} (${items.length})</span></summary>
        <div class="accordion-body">${items.map(w => `
          <div class="data-item">
            <div><strong>${U.esc(w.exercise)}</strong><br><small>${w.weights.map((_, i) => setLine(w, i)).join('<br>')}</small></div>
            <strong>śr. ${w.avgWeight.toFixed(1)} kg</strong>
          </div>`).join('')}</div>
      </details>`).join('') || '<div class="muted center">Brak treningów</div>';
  }

  function render() { fillSelects(); renderHistory(); renderStats(); renderCalendar(); }

  // ---------- zdarzenia ----------
  function init() {
    $('workoutDate').value = U.iso(Date.now());
    renderSeries(3);
    $('exerciseSelect').addEventListener('change', onExerciseChange);
    $('seriesCount').addEventListener('change', onCountChange);
    $('statExerciseSelect').addEventListener('change', renderStats);

    $('workoutFilterGroup').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      $('workoutFilterGroup').querySelectorAll('button').forEach(x => {
        x.classList.toggle('active', x === b);
        x.setAttribute('aria-pressed', x === b);
      });
      state.filter = b.dataset.filter;
      renderStats();
    });

    $('calendarTitle').parentElement.addEventListener('click', e => {
      const b = e.target.closest('[data-nav]');
      if (!b) return;
      state.cal = new Date(state.cal.getFullYear(), state.cal.getMonth() + +b.dataset.nav, 1); // dzień 1 – bez przeskoków miesięcy
      renderCalendar();
    });
    $('calendarGrid').addEventListener('click', e => {
      const d = e.target.closest('[data-iso]');
      if (d) showDay(d.dataset.iso);
    });

    $('workoutForm').addEventListener('submit', async e => {
      e.preventDefault();
      const date = $('workoutDate').value, exercise = $('exerciseSelect').value;
      if (!date || !exercise) return;
      const rows = readSeries();
      const weights = rows.map(r => parseFloat(r[0]) || 0), reps = rows.map(r => parseInt(r[1]) || 0);
      const rec = { date, ts: U.ts(date), exercise, weights, reps, avgWeight: U.avg(weights) || 0 };
      D.workouts.push(rec); D.workouts.sort(U.byTs); App.invalidate();
      const id = await App.run(
        () => App.db.addData('Treningi', { Data: date, Cwiczenie: exercise, Serie: weights.length, Wagi: weights, Powtorzenia: reps }),
        () => U.drop(D.workouts, rec), e.submitter);
      if (id) rec.id = id;
    });
  }

  App.register('workout', { collections: ['Treningi', 'Cwiczenia'], parse, init, render });
})();
</script>
