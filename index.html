<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dziennik Formy (Firebase)</title>

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="firebase-config.js"></script>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="top-bar-title">📊 Dziennik Formy</div>
    <div class="top-controls">
      <button class="icon-btn" onclick="toggleTheme()"><span id="themeIcon">🌙</span></button>
      <button class="icon-btn" onclick="changeFontSize(-1)">A-</button>
      <button class="icon-btn" onclick="changeFontSize(1)">A+</button>
    </div>
  </div>

  <div id="status">⏳ Łączenie z Firebase...</div>

  <!-- KONTENERY ZAKŁADEK -->
  <div id="tab-main" class="tab-content active"></div>
  <div id="tab-weight" class="tab-content"></div>
  <div id="tab-workout" class="tab-content"></div>
  <div id="tab-cardio" class="tab-content"></div>
  <div id="tab-body" class="tab-content"></div>
  <div id="tab-settings" class="tab-content"></div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('main', this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Główna
  </button>
  <button class="nav-item" onclick="switchTab('weight', this)">
    <svg viewBox="0 0 24 24"><path d="M20.4 9A9 9 0 1 0 3.6 9L2 13h20l-1.6-4zM12 13v4m-4 0h8"/></svg>
    Waga
  </button>
  <button class="nav-item" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M18 7v10M6 7v10"/></svg>
    Treningi
  </button>
  <button class="nav-item" onclick="switchTab('cardio', this)">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Kardio
  </button>
  <button class="nav-item" onclick="switchTab('body', this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
    Obwody
  </button>
  <button class="nav-item" onclick="switchTab('settings', this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Ustawienia
  </button>
</nav>

<script>
  // GLÓWNY MAGAZYN DANYCH APLIKACJI
  window.weightData = [];
  window.exercisesList = [];
  window.bodyPartsList = [];
  window.workoutData = [];
  window.cardioData = [];
  window.cardioTypesList = [];
  window.bodyMeasurementsData = [];

  let currentFontSize = parseInt(localStorage.getItem('app_font_size')) || 16;

  // FUNKCJE POMOCNICZE WSPÓLNE
  window.parseLocalDate = function(dStr) {
    if (!dStr) return new Date(NaN);
    const parts = String(dStr).split('T')[0].split('-');
    if (parts.length === 3) {
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }
    return new Date(dStr);
  };

  window.formatDate = function(dIn) {
    if (!dIn) return '';
    const d = window.parseLocalDate(dIn);
    if (isNaN(d.getTime())) return String(dIn);
    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
  };

  window.formatDateISO = function(dObj) {
    return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
  };

  window.formatReps = function(n) {
    const count = parseInt(n) || 0;
    if (count === 1) return '1 powtórzenie';
    const abs = Math.abs(count);
    const lastTwo = abs % 100;
    const lastOne = abs % 10;
    if (lastTwo >= 11 && lastTwo <= 14) return `${count} powtórzeń`;
    if (lastOne >= 2 && lastOne <= 4) return `${count} powtórzenia`;
    return `${count} powtórzeń`;
  };

  window.getAverage = function(arr) { 
    return arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1) : '-'; 
  };

  window.getMedian = function(arr) {
    if (!arr.length) return '-';
    const s = [...arr].sort((a, b) => a - b), m = Math.floor(s.length / 2);
    return (s.length % 2 !== 0 ? s[m] : (s[m - 1] + s[m]) / 2).toFixed(1);
  };

  window.getCssColor = function(v) { 
    return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); 
  };

  window.drawChart = function(canvasId, values, range, unit) {
    const canvas = document.getElementById(canvasId); 
    if (!canvas || !canvas.parentElement.clientWidth) return;
    const ctx = canvas.getContext('2d'); 
    canvas.width = canvas.parentElement.clientWidth - 28; 
    canvas.height = 180;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let vals = [...values].filter(v => !isNaN(v));
    if (range !== 'all' && vals.length > parseInt(range)) vals = vals.slice(-parseInt(range));
    if (vals.length < 2) {
      ctx.fillStyle = window.getCssColor('--text-muted'); 
      ctx.font = '14px sans-serif'; 
      ctx.textAlign = 'center';
      ctx.fillText('Za mało danych', canvas.width / 2, canvas.height / 2); 
      return;
    }
    const pad = 30, min = Math.max(0, Math.min(...vals) - 1), max = Math.max(...vals) + 1;
    const getX = i => pad + (i / (vals.length - 1)) * (canvas.width - 2 * pad);
    const getY = v => canvas.height - pad - ((v - min) / (max - min)) * (canvas.height - 2 * pad);

    ctx.strokeStyle = window.getCssColor('--primary'); 
    ctx.lineWidth = 3; 
    ctx.beginPath();
    vals.forEach((v, i) => i === 0 ? ctx.moveTo(getX(i), getY(v)) : ctx.lineTo(getX(i), getY(v))); 
    ctx.stroke();

    ctx.fillStyle = window.getCssColor('--primary');
    vals.forEach((v, i) => {
      ctx.beginPath(); 
      ctx.arc(getX(i), getY(v), 3.5, 0, Math.PI * 2); 
      ctx.fill();
    });
  };

  window.toggleAccordion = function(header) {
    const content = header.nextElementSibling;
    const arrow = header.querySelector('.accordion-arrow');
    const isOpen = content.classList.contains('open');
    content.classList.toggle('open', !isOpen);
    if(arrow) arrow.innerText = isOpen ? '▶' : '▼';
  };

  function initThemeAndFont() {
    const th = localStorage.getItem('app_theme') || 'light';
    document.documentElement.setAttribute('data-theme', th);
    const themeIcon = document.getElementById('themeIcon');
    if (themeIcon) themeIcon.innerText = th === 'dark' ? '☀️' : '🌙';
    document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
  }

  window.toggleTheme = function() {
    const th = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th);
    localStorage.setItem('app_theme', th);
    document.getElementById('themeIcon').innerText = th === 'dark' ? '☀️' : '🌙';
    window.refreshActiveTabChart();
  };

  window.changeFontSize = function(delta) {
    currentFontSize = Math.min(22, Math.max(12, currentFontSize + delta));
    document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
    localStorage.setItem('app_font_size', currentFontSize);
    window.refreshActiveTabChart();
  };

  window.refreshActiveTabChart = function() {
    if (typeof window.drawWeightChart === 'function') window.drawWeightChart();
    if (typeof window.updateWorkoutStatsAndChart === 'function') window.updateWorkoutStatsAndChart();
    if (typeof window.updateCardioStatsAndChart === 'function') window.updateCardioStatsAndChart();
    if (typeof window.drawBodyChart === 'function') window.drawBodyChart();
  };

  // ŁADOWANIE PLIKÓW ZAKŁADEK Z WSTRZYKIWANIEM SKRYPTÓW
  async function loadTabContent() {
    try {
      const [mainRes, weightRes, workoutRes, cardioRes, bodyRes, settingsRes] = await Promise.all([
        fetch('tab-main.html'),
        fetch('tab-weight.html'),
        fetch('tab-workout.html'),
        fetch('tab-cardio.html'),
        fetch('tab-body.html'),
        fetch('tab-settings.html')
      ]);

      document.getElementById('tab-main').innerHTML = await mainRes.text();
      document.getElementById('tab-weight').innerHTML = await weightRes.text();
      document.getElementById('tab-workout').innerHTML = await workoutRes.text();
      document.getElementById('tab-cardio').innerHTML = await cardioRes.text();
      document.getElementById('tab-body').innerHTML = await bodyRes.text();
      document.getElementById('tab-settings').innerHTML = await settingsRes.text();

      // Wykonaj skrypty z załadowanych plików HTML
      document.querySelectorAll('.tab-content script').forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });

    } catch (e) {
      console.error("Błąd ładowania plików zakładek:", e);
    }
  }

  window.switchTab = function(tabId, btn) {
    if (tabId === 'settings') {
      const pin = localStorage.getItem('settings_pin') || '1234';
      if (sessionStorage.getItem('pin_authenticated') !== 'true') {
        const entered = prompt("PIN do Ustawień:");
        if (entered !== pin) { alert("Błędny PIN!"); return; }
        sessionStorage.setItem('pin_authenticated', 'true');
      }
    }

    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    btn.classList.add('active');

    if (tabId === 'main' && typeof window.renderMainDashboard === 'function') window.renderMainDashboard();
    else if (tabId === 'weight' && typeof window.renderWeightTab === 'function') window.renderWeightTab();
    else if (tabId === 'workout' && typeof window.renderWorkoutTab === 'function') window.renderWorkoutTab();
    else if (tabId === 'cardio' && typeof window.renderCardioTab === 'function') window.renderCardioTab();
    else if (tabId === 'body' && typeof window.renderBodyTab === 'function') window.renderBodyTab();
    else if (tabId === 'settings' && typeof window.renderSettingsLists === 'function') window.renderSettingsLists();
  };

  window.updateApp = function() {
    if (typeof window.renderMainDashboard === 'function') window.renderMainDashboard();
    if (typeof window.renderWeightTab === 'function') window.renderWeightTab();
    if (typeof window.renderWorkoutTab === 'function') window.renderWorkoutTab();
    if (typeof window.renderCardioTab === 'function') window.renderCardioTab();
    if (typeof window.renderBodyTab === 'function') window.renderBodyTab();
    if (typeof window.renderSettingsLists === 'function') window.renderSettingsLists();
  };

  // POBIERANIE Z FIREBASE
  window.fetchFromFirebaseFast = async function() {
    try {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "⏳ Pobieranie danych z Firebase...";

      const [waga, cwiczenia, obwody, treningi, kardio, kardioTypy] = await Promise.all([
        window.firebaseFunctions.getData('Waga'),
        window.firebaseFunctions.getData('Cwiczenia'),
        window.firebaseFunctions.getData('Obwody'),
        window.firebaseFunctions.getData('Treningi'),
        window.firebaseFunctions.getData('Kardio'),
        window.firebaseFunctions.getData('KardioTypy')
      ]);

      window.weightData = waga.map(item => ({
        id: item.id,
        date: item.Data || item.date || item.data || '',
        weight: parseFloat(String(item.Waga || item.weight || item.waga || 0).replace(',', '.'))
      })).filter(item => item.date && !isNaN(item.weight)).sort((a, b) => window.parseLocalDate(a.date) - window.parseLocalDate(b.date));

      window.exercisesList = cwiczenia.map(item => ({
        id: item.id,
        name: (item.Nazwa && item.Nazwa.trim() !== "") ? item.Nazwa.trim() : (item.Cwiczenie || item.exercise || '')
      })).filter(item => item.name);

      window.cardioTypesList = kardioTypy.map(item => ({
        id: item.id,
        name: (item.Nazwa && item.Nazwa.trim() !== "") ? item.Nazwa.trim() : (item.Typ || item.type || '')
      })).filter(item => item.name);

      if (window.cardioTypesList.length === 0) {
        window.cardioTypesList = [
          { id: '1', name: 'Bieżnia' },
          { id: '2', name: 'Rowerek' },
          { id: '3', name: 'Orbitrek' },
          { id: '4', name: 'Spacer' }
        ];
      }

      const setBody = new Set();
      cwiczenia.forEach(item => {
        if (item.ObwodyBaza && item.ObwodyBaza.trim() !== "") setBody.add(item.ObwodyBaza.trim());
      });
      obwody.forEach(item => {
        const p = item.Partia || item.part || item.Part || item.name;
        if (p && String(p).trim() !== "") setBody.add(String(p).trim());
      });

      window.bodyPartsList = Array.from(setBody).map((name, idx) => ({ id: `part_${idx}`, name }));

      window.bodyMeasurementsData = obwody.map(item => {
        let dateVal = item.Data || item.date || item.data || '';
        let partVal = item.Partia || item.part || item.Part || item.name || '';
        let sizeVal = NaN;

        for (const key in item) {
          if (key === 'id') continue;
          const val = item[key];
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(key)) dateVal = key;
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(val)) dateVal = val;
          if (!partVal && typeof val === 'string' && val.length > 1 && isNaN(val)) {
            if (window.bodyPartsList.some(b => b.name.toLowerCase() === val.toLowerCase())) partVal = val;
          }
        }

        const rawSize = item.Wymiar || item.size || item.wymiar || item.Wartosc;
        if (rawSize !== undefined && !isNaN(parseFloat(String(rawSize).replace(',', '.')))) {
          sizeVal = parseFloat(String(rawSize).replace(',', '.'));
        }

        return { id: item.id, date: dateVal, part: partVal, size: sizeVal };
      }).filter(item => item.date && item.part && !isNaN(item.size)).sort((a, b) => window.parseLocalDate(a.date) - window.parseLocalDate(b.date));

      window.workoutData = treningi.map(item => {
        let dateVal = item.Data || item.date || '';
        let exerciseVal = item.Cwiczenie || item.Nazwa || item.exercise || '';
        let weights = [], reps = [];

        const rawWeights = item.Wagi || item.weights || item.Serie_Wagi || [];
        if (Array.isArray(rawWeights)) weights = rawWeights.map(w => parseFloat(String(w).replace(',', '.')));
        else if (typeof rawWeights === 'string' || typeof rawWeights === 'number') {
          weights = String(rawWeights).split(',').map(w => parseFloat(w.trim().replace(',', '.'))).filter(v => !isNaN(v));
        }

        const rawReps = item.Powtorzenia || item.reps || [];
        if (Array.isArray(rawReps)) reps = rawReps.map(r => parseInt(r));
        else if (typeof rawReps === 'string') reps = rawReps.split(',').map(r => parseInt(r.trim())).filter(v => !isNaN(v));

        const avg = parseFloat(String(item.AvgWeight || item.Srednia || 0).replace(',', '.')) || (weights.length ? weights.reduce((a, b) => a + b, 0) / weights.length : 0);

        return {
          id: item.id, date: dateVal, exercise: exerciseVal, series: weights.length || 3,
          weights: weights.length ? weights : [30, 30, 30],
          reps: reps.length ? reps : [8, 8, 8],
          avgWeight: avg
        };
      }).filter(item => item.date && item.exercise).sort((a, b) => window.parseLocalDate(a.date) - window.parseLocalDate(b.date));

      window.cardioData = kardio.map(item => ({
        id: item.id,
        date: item.Data || item.date || '',
        type: item.Typ || item.type || 'Bieżnia',
        duration: item.Czas || item.duration || '',
        distance: parseFloat(String(item.Dystans || item.distance || 0).replace(',', '.')),
        pace: item.Tempo || item.pace || '',
        heartRate: parseInt(item.Tetno || item.heartRate || 0)
      })).filter(item => item.date).sort((a, b) => window.parseLocalDate(a.date) - window.parseLocalDate(b.date));

      if (statusEl) {
        statusEl.innerText = "🟢 Połączono z Firebase (Baza aktywna)";
        statusEl.style.background = "#bbf7d0";
      }

      window.updateApp();

    } catch (err) {
      console.error(err);
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerText = "🔴 Błąd połączenia z Firebase";
        statusEl.style.background = "#fecaca";
      }
    }
  };

  // INICJALIZACJA APLIKACJI
  window.startApp = async function() {
    const savedPin = localStorage.getItem('settings_pin') || '1234';
    if (sessionStorage.getItem('app_authenticated') !== 'true') {
      const entered = prompt("Wprowadź PIN dostępowy:");
      if (entered !== savedPin) {
        document.body.innerHTML = '<div style="text-align:center; padding:50px; font-family:sans-serif;"><h2>⛔ Brak dostępu</h2><p>Wprowadzono nieprawidłowy PIN.</p></div>';
        return;
      }
      sessionStorage.setItem('app_authenticated', 'true');
    }

    initThemeAndFont();
    await loadTabContent();
    await window.fetchFromFirebaseFast();
  };
</script>
</body>
</html>
