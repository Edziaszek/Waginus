<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dziennik Formy</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <!-- Motyw i rozmiar czcionki ustawiane zanim strona się narysuje (bez migotania) -->
  <script>try{const r=document.documentElement;r.dataset.theme=localStorage.getItem('app_theme')||'light';r.style.setProperty('--font-size-base',(parseInt(localStorage.getItem('app_font_size'))||16)+'px')}catch(e){}</script>
  <link rel="stylesheet" href="style.css?v=5">
  <script src="app.js?v=5" defer></script>
  <script type="module" src="firebase-config.js?v=5"></script>
</head>
<body>

<div class="container" id="app">
  <header class="top-bar">
    <div class="top-bar-title">📊 Dziennik Formy</div>
    <div class="top-controls">
      <button class="icon-btn" id="statusBtn" aria-label="Status połączenia"><span class="dot busy" id="statusDot"></span></button>
      <button class="icon-btn" id="themeBtn" aria-label="Zmień motyw"><span id="themeIcon">🌙</span></button>
      <button class="icon-btn" data-font="-1" aria-label="Mniejszy tekst">A-</button>
      <button class="icon-btn" data-font="1" aria-label="Większy tekst">A+</button>
    </div>
    <div class="status-pop" id="statusPop" role="status" hidden></div>
  </header>
  <!-- Sekcje #tab-<nazwa> tworzy app.js na podstawie przycisków poniżej -->
</div>

<nav class="bottom-nav">
  <button class="nav-item active" data-tab="main">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Główna
  </button>
  <button class="nav-item" data-tab="weight">
    <svg viewBox="0 0 24 24"><path d="M20.4 9A9 9 0 1 0 3.6 9L2 13h20l-1.6-4zM12 13v4m-4 0h8"/></svg>Waga
  </button>
  <button class="nav-item" data-tab="workout">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M18 7v10M6 7v10"/></svg>Treningi
  </button>
  <button class="nav-item" data-tab="cardio">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Kardio
  </button>
  <button class="nav-item" data-tab="body">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>Obwody
  </button>
  <button class="nav-item" data-tab="settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Ustawienia
  </button>
</nav>

</body>
</html>
