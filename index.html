<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dziennik Formy (Firebase)</title>

  <!-- Ochrona przed botami, spambotami i wyszukiwarkami -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">

  <link rel="stylesheet" href="style.css">
  <script type="module" src="firebase-config.js"></script>
</head>
<body>

<div class="container">

  <div class="top-bar">
    <div class="top-bar-title">📊 Dziennik Formy</div>
    <div class="top-controls">
      <button class="icon-btn" onclick="toggleTheme()"><span id="themeIcon">🌙</span></button>
      <button class="icon-btn" onclick="changeFontSize(-1)">A-</button>
      <button class="icon-btn" onclick="changeFontSize(1)">A+</button>
    </div>
  </div>

  <div id="status">⏳ Łączenie z Firebase...</div>

  <!-- ZAKŁADKA 0: GŁÓWNA (STARTOWA) -->
  <div id="tab-main" class="tab-content active"></div>

  <!-- ZAKŁADKA 1: WAGA -->
  <div id="tab-weight" class="tab-content"></div>

  <!-- ZAKŁADKA 2: TRENINGI -->
  <div id="tab-workout" class="tab-content"></div>

  <!-- ZAKŁADKA 3: OBWODY -->
  <div id="tab-body" class="tab-content"></div>

  <!-- ZAKŁADKA 4: USTAWIENIA -->
  <div id="tab-settings" class="tab-content"></div>

</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('main', this)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    Główna
  </button>
  <button class="nav-item" onclick="switchTab('weight', this)">
    <svg viewBox="0 0 24 24"><path d="M20.4 9A9 9 0 1 0 3.6 9L2 13h20l-1.6-4zM12 13v4m-4 0h8"/></svg>
    Waga
  </button>
  <button class="nav-item" onclick="switchTab('workout', this)">
    <svg viewBox="0 0 24 24"><path d="M6.5 6.5h11M6.5 17.5h11M4 9v6M20 9v6M18 7v10M6 7v10"/></svg>
    Treningi
  </button>
  <button class="nav-item" onclick="switchTab('body', this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
    Obwody
  </button>
  <button class="nav-item" onclick="switchTab('settings', this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Ustawienia
  </button>
</nav>

<script>
  let weightData = [], exercisesList = [], bodyPartsList = [], workoutData = [], bodyMeasurementsData = [];
  let currentChartRange = '30', currentWorkoutChartRange = '30', currentBodyChartRange = '30';
  let currentWorkoutPeriod = 'week', currentBodyPeriod = 'week';
  let currentCalendarDate = new Date();
  let currentFontSize = parseInt(localStorage.getItem('app_font_size')) || 16;

  function formatReps(n) {
    const count = parseInt(n) || 0;
    if (count === 1) return '1 powtórzenie';
    const abs = Math.abs(count);
    const lastTwo = abs % 100;
    const lastOne = abs % 10;
    if (lastTwo >= 11 && lastTwo <= 14) return `${count} powtórzeń`;
    if (lastOne >= 2 && lastOne <= 4) return `${count} powtórzenia`;
    return `${count} powtórzeń`;
  }

 async function loadTabContent() {
    try {
      const [mainRes, weightRes, workoutRes, bodyRes, settingsRes] = await Promise.all([
        fetch('tab-main.html'),
        fetch('tab-weight.html'),
        fetch('tab-workout.html'),
        fetch('tab-body.html'),
        fetch('tab-settings.html')
      ]);
      document.getElementById('tab-main').innerHTML = await mainRes.text();
      document.getElementById('tab-weight').innerHTML = await weightRes.text();
      document.getElementById('tab-workout').innerHTML = await workoutRes.text();
      document.getElementById('tab-body').innerHTML = await bodyRes.text();
      document.getElementById('tab-settings').innerHTML = await settingsRes.text();

      // Przypisanie nasłuchiwania w formularzu dodawania treningu
      const exSel = document.getElementById('exerciseSelect');
      if (exSel) {
        exSel.onchange = handleExerciseChangeForWeights;
      }
      const seriesCnt = document.getElementById('seriesCount');
      if (seriesCnt) {
        seriesCnt.onchange = () => handleExerciseChangeForWeights();
      }

      // Przypisanie nasłuchiwania w sekcji STATYSTYK TRENINGOWYCH (kluczowe dla przycisków!)
      const statExSel = document.getElementById('statExerciseSelect');
      if (statExSel) {
        statExSel.onchange = () => updateWorkoutStatsAndChart();
      }
    } catch (e) {
      console.error("Błąd ładowania zakładek:", e);
    }
  }

  function parseLocalDate(dStr) {
    if (!dStr) return new Date(NaN);
    const parts = String(dStr).split('T')[0].split('-');
    if (parts.length === 3) {
      return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
    }
    return new Date(dStr);
  }

  function formatDate(dIn) {
    if (!dIn) return '';
    const d = parseLocalDate(dIn);
    if (isNaN(d.getTime())) return String(dIn);
    return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
  }

  function formatDateISO(dObj) {
    return `${dObj.getFullYear()}-${String(dObj.getMonth() + 1).padStart(2, '0')}-${String(dObj.getDate()).padStart(2, '0')}`;
  }

  function initThemeAndFont() {
    const th = localStorage.getItem('app_theme') || 'light';
    document.documentElement.setAttribute('data-theme', th);
    const themeIcon = document.getElementById('themeIcon');
    if (themeIcon) themeIcon.innerText = th === 'dark' ? '☀️' : '🌙';
    document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
  }

  function toggleTheme() {
    const th = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', th);
    localStorage.setItem('app_theme', th);
    document.getElementById('themeIcon').innerText = th === 'dark' ? '☀️' : '🌙';
    drawNativeChart(); drawWorkoutChart(); drawBodyChart();
  }

  function changeFontSize(delta) {
    currentFontSize = Math.min(22, Math.max(12, currentFontSize + delta));
    document.documentElement.style.setProperty('--font-size-base', `${currentFontSize}px`);
    localStorage.setItem('app_font_size', currentFontSize);
    drawNativeChart(); drawWorkoutChart(); drawBodyChart();
  }

  function switchTab(tabId, btn) {
    if (tabId === 'settings') {
      const pin = localStorage.getItem('settings_pin') || '1234';
      if (sessionStorage.getItem('pin_authenticated') !== 'true') {
        const entered = prompt("PIN do Ustawień:");
        if (entered !== pin) { alert("Błędny PIN!"); return; }
        sessionStorage.setItem('pin_authenticated', 'true');
      }
    }
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    btn.classList.add('active');
    if (tabId === 'main') renderMainDashboard();
    else if (tabId === 'weight') drawNativeChart();
    else if (tabId === 'workout') { drawWorkoutChart(); renderCalendar(); }
    else if (tabId === 'body') drawBodyChart();
    else if (tabId === 'settings') renderSettingsLists();
  }

  function switchSubTab(subId, btn) {
    document.querySelectorAll('.subtab-content').forEach(st => st.classList.remove('active'));
    document.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`subtab-${subId}`).classList.add('active');
    btn.classList.add('active');
  }

  function toggleAccordion(header) {
    const content = header.nextElementSibling;
    const arrow = header.querySelector('.accordion-arrow');
    const isOpen = content.classList.contains('open');
    content.classList.toggle('open', !isOpen);
    if(arrow) arrow.innerText = isOpen ? '▶' : '▼';
  }

  window.startApp = async function() {
    const savedPin = localStorage.getItem('settings_pin') || '1234';
    if (sessionStorage.getItem('app_authenticated') !== 'true') {
      const entered = prompt("Wprowadź PIN dostępowy:");
      if (entered !== savedPin) {
        document.body.innerHTML = '<div style="text-align:center; padding:50px; font-family:sans-serif;"><h2>⛔ Brak dostępu</h2><p>Wprowadzono nieprawidłowy PIN.</p></div>';
        return;
      }
      sessionStorage.setItem('app_authenticated', 'true');
    }

    initThemeAndFont();
    await loadTabContent();

    const dateInput = document.getElementById('dateInput');
    const workoutDate = document.getElementById('workoutDate');
    const bodyDate = document.getElementById('bodyDate');
    if (dateInput) dateInput.valueAsDate = new Date();
    if (workoutDate) workoutDate.valueAsDate = new Date();
    if (bodyDate) bodyDate.valueAsDate = new Date();

    const weightForm = document.getElementById('weightForm');
    const workoutForm = document.getElementById('workoutForm');
    const bodyForm = document.getElementById('bodyForm');

    if (weightForm) weightForm.addEventListener('submit', handleWeightFormSubmit);
    if (workoutForm) workoutForm.addEventListener('submit', handleWorkoutFormSubmit);
    if (bodyForm) bodyForm.addEventListener('submit', handleBodyFormSubmit);

    renderSeriesInputs(3);
    setupFilters();
    await fetchFromFirebaseFast();
  };

let currentWorkoutFilter = 'week';

  function setupFilters() {
    document.querySelectorAll('#weekFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#weekFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); setWeekFilter(e.target.getAttribute('data-type'));
    }));
    document.querySelectorAll('#monthFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#monthFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); setMonthFilter(e.target.getAttribute('data-type'));
    }));
    document.querySelectorAll('#chartFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#chartFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); currentChartRange = e.target.getAttribute('data-range'); drawNativeChart();
    }));
    
    // Obsługa 4 przycisków w statystykach treningowych
    document.querySelectorAll('#workoutFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#workoutFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); 
      currentWorkoutFilter = e.target.getAttribute('data-filter'); 
      updateWorkoutStatsAndChart();
    }));

    document.querySelectorAll('#bodyPeriodFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#bodyPeriodFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); currentBodyPeriod = e.target.getAttribute('data-period'); updateBodyStats();
    }));
    document.querySelectorAll('#bodyChartFilterGroup button').forEach(btn => btn.addEventListener('click', (e) => {
      document.querySelectorAll('#bodyChartFilterGroup button').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active'); currentBodyChartRange = e.target.getAttribute('data-range'); drawBodyChart();
    }));

    const statBody = document.getElementById('statBodySelect');
    const cFrom = document.getElementById('customFrom');
    const cTo = document.getElementById('customTo');

    if (statBody) statBody.addEventListener('change', () => { updateBodyStats(); drawBodyChart(); });
    if (cFrom) cFrom.addEventListener('change', calculateCustomRange);
    if (cTo) cTo.addEventListener('change', calculateCustomRange);
  }

  function updateWorkoutStatsAndChart() {
    const sel = document.getElementById('statExerciseSelect'); 
    if (!sel || !sel.value) return;

    const exerciseName = sel.value;
    const allExWorkouts = workoutData.filter(w => w.exercise.toLowerCase() === exerciseName.toLowerCase());

    let filteredWorkouts = [...allExWorkouts];
    const now = new Date();

    if (currentWorkoutFilter === 'week') {
      const day = now.getDay() || 7;
      const monday = new Date(now);
      monday.setDate(now.getDate() - day + 1); 
      monday.setHours(0,0,0,0);
      filteredWorkouts = allExWorkouts.filter(w => parseLocalDate(w.date) >= monday);
    } else if (currentWorkoutFilter === 'month') {
      const curM = now.getMonth(), curY = now.getFullYear();
      filteredWorkouts = allExWorkouts.filter(w => {
        const dt = parseLocalDate(w.date);
        return dt.getMonth() === curM && dt.getFullYear() === curY;
      });
    } else if (currentWorkoutFilter === '90') {
      const limitDate = new Date();
      limitDate.setDate(now.getDate() - 90);
      filteredWorkouts = allExWorkouts.filter(w => parseLocalDate(w.date) >= limitDate);
    }
    // dla 'all' bierzemy wszystko

    // Wyciągamy średnie wagi do obliczeń statystyk tekstowych
    const weightsForStats = filteredWorkouts.map(w => w.avgWeight);
    const wAvg = document.getElementById('workoutAvgResult');
    const wMed = document.getElementById('workoutMedResult');
    if (wAvg) wAvg.innerText = getAverage(weightsForStats) + ' kg';
    if (wMed) wMed.innerText = getMedian(weightsForStats) + ' kg';

    // Rysowanie wykresu na podstawie przefiltrowanych danych
    drawChart('workoutChart', weightsForStats, 'all', 'kg');
  }

  function updateWorkoutStats() {
    updateWorkoutStatsAndChart();
  }

  function drawWorkoutChart() {
    updateWorkoutStatsAndChart();
  }

  function renderSeriesInputs(count, defaultWeights = [], defaultReps = []) {
    const container = document.getElementById('seriesInputsContainer');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      const wVal = defaultWeights[i - 1] !== undefined ? defaultWeights[i - 1] : (defaultWeights[0] || 30);
      const rVal = defaultReps[i - 1] !== undefined ? defaultReps[i - 1] : (defaultReps[0] || 8);

      const row = document.createElement('div');
      row.className = 'series-row';
      row.style.display = 'flex';
      row.style.gap = '6px';
      row.style.alignItems = 'center';
      row.style.marginBottom = '6px';

      row.innerHTML = `
        <span class="series-label" style="min-width:55px;">Seria ${i}:</span>
        <div style="position:relative; flex:1;">
          <input type="number" id="seriesWeight_${i}" class="series-input" step="0.5" value="${wVal}" style="width:100%; padding-right:36px; box-sizing:border-box;" required>
          <span style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85em; pointer-events:none; font-weight:bold;">kg</span>
        </div>
        <div style="position:relative; flex:1;">
          <input type="number" id="seriesReps_${i}" class="series-input" step="1" value="${rVal}" style="width:100%; padding-right:50px; box-sizing:border-box;" required>
          <span style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85em; pointer-events:none; font-weight:bold;">powt.</span>
        </div>
      `;
      container.appendChild(row);
    }
  }

  function handleExerciseChangeForWeights() {
    const selectedExerciseInput = document.getElementById('exerciseSelect');
    if (!selectedExerciseInput) return;
    const selectedExercise = selectedExerciseInput.value.trim().toLowerCase();
    const seriesCountInput = document.getElementById('seriesCount');
    if (!seriesCountInput) return;

    if (!selectedExercise) {
      const count = parseInt(seriesCountInput.value) || 3;
      renderSeriesInputs(count);
      return;
    }

    const lastWorkout = [...workoutData].reverse().find(w => w.exercise && w.exercise.trim().toLowerCase() === selectedExercise);

    if (lastWorkout && lastWorkout.weights && lastWorkout.weights.length > 0) {
      seriesCountInput.value = lastWorkout.weights.length;
      renderSeriesInputs(lastWorkout.weights.length, lastWorkout.weights, lastWorkout.reps || []);
    } else {
      const count = parseInt(seriesCountInput.value) || 3;
      renderSeriesInputs(count);
    }
  }

  async function fetchFromFirebaseFast() {
    try {
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "⏳ Pobieranie danych z Firebase...";

      const [waga, cwiczenia, obwody, treningi] = await Promise.all([
        window.firebaseFunctions.getData('Waga'),
        window.firebaseFunctions.getData('Cwiczenia'),
        window.firebaseFunctions.getData('Obwody'),
        window.firebaseFunctions.getData('Treningi')
      ]);

      weightData = waga.map(item => ({
        id: item.id,
        date: item.Data || item.date || item.data || '',
        weight: parseFloat(String(item.Waga || item.weight || item.waga || 0).replace(',', '.'))
      })).filter(item => item.date && !isNaN(item.weight)).sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

      exercisesList = cwiczenia.map(item => ({
        id: item.id,
        name: (item.Nazwa && item.Nazwa.trim() !== "") ? item.Nazwa.trim() : (item.Cwiczenie || item.exercise || '')
      })).filter(item => item.name);

      const setBody = new Set();
      cwiczenia.forEach(item => {
        if (item.ObwodyBaza && item.ObwodyBaza.trim() !== "") setBody.add(item.ObwodyBaza.trim());
      });
      obwody.forEach(item => {
        const p = item.Partia || item.part || item.Part || item.name;
        if (p && String(p).trim() !== "") setBody.add(String(p).trim());
      });

      bodyPartsList = Array.from(setBody).map((name, idx) => ({ id: `part_${idx}`, name }));

      bodyMeasurementsData = obwody.map(item => {
        let dateVal = item.Data || item.date || item.data || '';
        let partVal = item.Partia || item.part || item.Part || item.name || '';
        let sizeVal = NaN;

        for (const key in item) {
          if (key === 'id') continue;
          const val = item[key];
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(key)) dateVal = key;
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(val)) dateVal = val;
          if (!partVal && typeof val === 'string' && val.length > 1 && isNaN(val)) {
            if (bodyPartsList.some(b => b.name.toLowerCase() === val.toLowerCase())) {
              partVal = val;
            }
          }
        }

        if (!partVal) {
          for (const key in item) {
            if (key === 'id' || key === 'Data' || key === 'date' || key === 'Wymiar') continue;
            if (bodyPartsList.some(b => b.name.toLowerCase() === key.toLowerCase())) {
              partVal = key;
              if (!dateVal) dateVal = item[key];
            }
          }
        }

        const rawSize = item.Wymiar || item.size || item.wymiar || item.Wartosc;
        if (rawSize !== undefined && !isNaN(parseFloat(String(rawSize).replace(',', '.')))) {
          sizeVal = parseFloat(String(rawSize).replace(',', '.'));
        } else {
          for (const key in item) {
            const val = parseFloat(String(item[key]).replace(',', '.'));
            if (!isNaN(val) && val > 5 && val < 300 && key !== 'id' && item[key] !== dateVal && item[key] !== partVal) {
              sizeVal = val;
              break;
            }
          }
        }

        return {
          id: item.id,
          date: dateVal,
          part: partVal,
          size: sizeVal
        };
      }).filter(item => item.date && item.part && !isNaN(item.size)).sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

      workoutData = treningi.map(item => {
        let dateVal = item.Data || item.date || '';
        let exerciseVal = item.Cwiczenie || item.Nazwa || item.exercise || '';
        let weights = [];

        for (const key in item) {
          if (key === 'id') continue;
          const val = item[key];
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(key)) dateVal = key;
          if (!dateVal && /^\d{4}-\d{2}-\d{2}$/.test(val)) dateVal = val;
          if (!exerciseVal && typeof val === 'string' && val.length > 2 && isNaN(val) && key !== 'id') {
            if (exercisesList.some(e => e.name.toLowerCase() === val.toLowerCase())) {
              exerciseVal = val;
            }
          }
        }

        const rawWeights = item.Wagi || item.weights || item.Serie_Wagi || [];
        if (Array.isArray(rawWeights)) {
          weights = rawWeights.map(w => parseFloat(String(w).replace(',', '.')));
        } else if (typeof rawWeights === 'string' || typeof rawWeights === 'number') {
          weights = String(rawWeights).split(',').map(w => parseFloat(w.trim().replace(',', '.'))).filter(v => !isNaN(v));
        }

        if (weights.length === 0) {
          for (const key in item) {
            const val = parseFloat(String(item[key]).replace(',', '.'));
            if (!isNaN(val) && val > 0 && val < 500 && key !== 'id' && item[key] !== dateVal && item[key] !== exerciseVal) {
              weights.push(val);
            }
          }
        }

        const rawReps = item.Powtorzenia || item.reps || [];
        let reps = [];
        if (Array.isArray(rawReps)) {
          reps = rawReps.map(r => parseInt(r));
        } else if (typeof rawReps === 'string') {
          reps = rawReps.split(',').map(r => parseInt(r.trim())).filter(v => !isNaN(v));
        }

        const avg = parseFloat(String(item.AvgWeight || item.Srednia || 0).replace(',', '.')) || (weights.length ? weights.reduce((a, b) => a + b, 0) / weights.length : 0);

        return {
          id: item.id,
          date: dateVal,
          exercise: exerciseVal,
          series: weights.length || 3,
          weights: weights.length ? weights : [30, 30, 30],
          reps: reps.length ? reps : [8, 8, 8],
          avgWeight: avg
        };
      }).filter(item => item.date && item.exercise).sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

      if (statusEl) {
        statusEl.innerText = "🟢 Połączono z Firebase (Baza aktywna)";
        statusEl.style.background = "#bbf7d0";
      }

      populateSelects();
      updateApp();

      setWeekFilter('current');
      setMonthFilter('current');
      updateWorkoutStats();
      updateBodyStats();

    } catch (err) {
      console.error(err);
      const statusEl = document.getElementById('status');
      if (statusEl) {
        statusEl.innerText = "🔴 Błąd połączenia z Firebase";
        statusEl.style.background = "#fecaca";
      }
    }
  }

  function populateSelects() {
    ['exerciseSelect', 'statExerciseSelect'].forEach(id => {

  async function handleWeightFormSubmit(e) {
    e.preventDefault();
    const date = document.getElementById('dateInput').value;
    const weight = parseFloat(document.getElementById('weightInput').value);
    if (!date || isNaN(weight)) return;

    document.getElementById('weightInput').value = '';
    weightData.push({ date, weight });
    weightData.sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
    updateApp();

    await window.firebaseFunctions.addData('Waga', { Data: date, Waga: weight });
    fetchFromFirebaseFast();
  }

  async function handleWorkoutFormSubmit(e) {
    e.preventDefault();
    const date = document.getElementById('workoutDate').value;
    const exercise = document.getElementById('exerciseSelect').value;
    const seriesCount = parseInt(document.getElementById('seriesCount').value);
    if (!date || !exercise) return;

    const weights = [];
    const reps = [];
    for (let i = 1; i <= seriesCount; i++) {
      const wInp = document.getElementById(`seriesWeight_${i}`);
      const rInp = document.getElementById(`seriesReps_${i}`);
      if (wInp) weights.push(parseFloat(wInp.value) || 0);
      if (rInp) reps.push(parseInt(rInp.value) || 0);
    }
    const avgWeight = weights.length ? weights.reduce((a, b) => a + b, 0) / weights.length : 0;

    workoutData.push({ date, exercise, series: seriesCount, weights, reps, avgWeight });
    workoutData.sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
    updateApp();

    await window.firebaseFunctions.addData('Treningi', { 
      Data: date, 
      Cwiczenie: exercise, 
      Serie: seriesCount, 
      Wagi: weights, 
      Powtorzenia: reps 
    });
    fetchFromFirebaseFast();
  }

  async function handleBodyFormSubmit(e) {
    e.preventDefault();
    const date = document.getElementById('bodyDate').value;
    const part = document.getElementById('bodySelect').value;
    const size = parseFloat(document.getElementById('bodySizeInput').value);
    if (!date || !part || isNaN(size)) return;

    bodyMeasurementsData.push({ date, part, size });
    bodyMeasurementsData.sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
    updateApp();

    await window.firebaseFunctions.addData('Obwody', { Data: date, Partia: part, Wymiar: size });
    fetchFromFirebaseFast();
  }

    renderMainDashboard();
    renderList(); renderStats(); drawNativeChart();
    renderWorkoutList(); updateWorkoutStats(); drawWorkoutChart(); renderCalendar();
    renderBodyList(); updateBodyStats(); drawBodyChart();
    renderSettingsLists();

  function renderMainDashboard() {
    const wContainer = document.getElementById('mainWeightSummary');
    if (wContainer) {
      if (!weightData.length) {
        wContainer.innerHTML = '<div style="color:var(--text-muted)">Brak pomiarów wagi w bazie.</div>';
      } else {
        const now = new Date(), sevenDaysAgo = new Date(); 
        sevenDaysAgo.setDate(now.getDate() - 7);
        const last7 = weightData.filter(d => parseLocalDate(d.date) >= sevenDaysAgo).map(d => d.weight);
        
        const currentWeightVal = last7.length ? parseFloat(getAverage(last7)) : weightData[weightData.length - 1].weight;
        const maxWeightVal = Math.max(...weightData.map(d => d.weight));
        const diffVal = (maxWeightVal - currentWeightVal).toFixed(1);

        wContainer.innerHTML = `
          <div class="data-item"><span>Aktualna waga (średnia z 7 dni):</span> <strong>${currentWeightVal.toFixed(1)} kg</strong></div>
          <div class="data-item"><span>Najwyższa waga w bazie:</span> <strong>${maxWeightVal.toFixed(1)} kg</strong></div>
          <div class="data-item"><span>Aktualnie schudłeś:</span> <strong style="color:var(--primary);">${diffVal} kg</strong></div>
        `;
      }
    }

    const bContainer = document.getElementById('mainBodySummary');
    if (bContainer) {
      if (!bodyPartsList.length) {
        bContainer.innerHTML = '<div style="color:var(--text-muted)">Brak zdefiniowanych obwodów w bazie.</div>';
      } else {
        bContainer.innerHTML = '';
        bodyPartsList.forEach(partObj => {
          const partName = partObj.name;
          const measurements = bodyMeasurementsData.filter(b => b.part.toLowerCase() === partName.toLowerCase());
          
          let lastVal = '-';
          let maxVal = '-';
          let diffVal = '-';

          if (measurements.length > 0) {
            const sorted = [...measurements].sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
            lastVal = sorted[sorted.length - 1].size.toFixed(1) + ' cm';
            const maxNumber = Math.max(...sorted.map(s => s.size));
            maxVal = maxNumber.toFixed(1) + ' cm';
            diffVal = (maxNumber - sorted[sorted.length - 1].size).toFixed(1) + ' cm';
          }

          const itemDiv = document.createElement('div');
          itemDiv.className = 'data-item';
          itemDiv.style.flexDirection = 'column';
          itemDiv.style.alignItems = 'stretch';
          itemDiv.innerHTML = `
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:4px;">
              <span>${partName}</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:0.9em; color:var(--text-muted);">
              <span>Ostatni: <strong>${lastVal}</strong></span>
              <span>Najwyższy: <strong>${maxVal}</strong></span>
              <span>Różnica: <strong style="color:var(--primary);">${diffVal}</strong></span>
            </div>
          `;
          bContainer.appendChild(itemDiv);
        });
      }
    }

    const tContainer = document.getElementById('mainWorkoutSummary');
    if (tContainer) {
      if (!exercisesList.length) {
        tContainer.innerHTML = '<div style="color:var(--text-muted)">Brak zdefiniowanych ćwiczeń w bazie.</div>';
      } else {
        tContainer.innerHTML = '';
        exercisesList.forEach(exObj => {
          const exName = exObj.name;
          const exWorkouts = workoutData.filter(w => w.exercise.toLowerCase() === exName.toLowerCase());

          let lastStr = '-';
          let recordStr = '-';

          if (exWorkouts.length > 0) {
            const sortedWorkouts = [...exWorkouts].sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));
            const lastWorkout = sortedWorkouts[sortedWorkouts.length - 1];
            if (lastWorkout.weights && lastWorkout.weights.length > 0) {
              const maxW = Math.max(...lastWorkout.weights);
              const idx = lastWorkout.weights.indexOf(maxW);
              const repVal = (lastWorkout.reps && lastWorkout.reps[idx]) ? lastWorkout.reps[idx] : 8;
              lastStr = `${maxW} kg x ${formatReps(repVal)}`;
            }

            let maxWeight = 0;
            let correspondingReps = 8;
            exWorkouts.forEach(w => {
              if (w.weights && w.weights.length > 0) {
                w.weights.forEach((wt, i) => {
                  if (wt > maxWeight) {
                    maxWeight = wt;
                    correspondingReps = (w.reps && w.reps[i]) ? w.reps[i] : 8;
                  }
                });
              }
            });
            if (maxWeight > 0) {
              recordStr = `${maxWeight} kg x ${formatReps(correspondingReps)}`;
            }
          }

          const itemDiv = document.createElement('div');
          itemDiv.className = 'data-item';
          itemDiv.innerHTML = `
            <div><strong>${exName}</strong><br><small style="color:var(--text-muted);">Ostatnio: ${lastStr}</small></div>
            <div style="text-align:right;">Rekord: <strong style="color:var(--primary);">${recordStr}</strong></div>
          `;
          tContainer.appendChild(itemDiv);
        });
      }
    }
  }

  function getAverage(arr) { return arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1) : '-'; }
  function getMedian(arr) {
    if (!arr.length) return '-';
    const s = [...arr].sort((a, b) => a - b), m = Math.floor(s.length / 2);
    return (s.length % 2 !== 0 ? s[m] : (s[m - 1] + s[m]) / 2).toFixed(1);
  }

  function renderStats() {
    if (!weightData.length) return;

    const last7 = weightData.filter(d => parseLocalDate(d.date) >= sevenDaysAgo).map(d => d.weight);
    const avg7d = document.getElementById('avg7d');
    const med7d = document.getElementById('med7d');
    const lastWeight = document.getElementById('lastWeight');
    if (avg7d) avg7d.innerText = getAverage(last7) + ' kg';
    if (med7d) med7d.innerText = getMedian(last7) + ' kg';
    if (lastWeight) lastWeight.innerText = weightData[weightData.length - 1].weight.toFixed(1) + ' kg';
  }

  function setWeekFilter(type) {
    const now = new Date(), day = now.getDay() || 7, monday = new Date(now);
    monday.setDate(now.getDate() - day + 1); monday.setHours(0,0,0,0);
    let start = new Date(monday), end = new Date(monday);
    end.setDate(start.getDate() + 6); end.setHours(23,59,59,999);
    if (type === 'prev1') { start.setDate(start.getDate() - 7); end.setDate(end.getDate() - 7); }
    else if (type === 'prev2') { start.setDate(start.getDate() - 14); end.setDate(end.getDate() - 14); }
    
    const filtered = weightData.filter(d => { 
      const dt = parseLocalDate(d.date); 
      return dt >= start && dt <= end; 
    }).map(d => d.weight);

    const wAvg = document.getElementById('weekAvgResult');
    const wMed = document.getElementById('weekMedResult');
    if (wAvg) wAvg.innerText = getAverage(filtered) + ' kg';
    if (wMed) wMed.innerText = getMedian(filtered) + ' kg';
  }

  function setMonthFilter(type) {
    const now = new Date(); let m = now.getMonth(), y = now.getFullYear();
    if (type === 'prev1') m -= 1; else if (type === 'prev2') m -= 2;
    if (m < 0) { m += 12; y -= 1; }
    
    const filtered = weightData.filter(d => { 
      const dt = parseLocalDate(d.date); 
      return dt.getMonth() === m && dt.getFullYear() === y; 
    }).map(d => d.weight);

    const mAvg = document.getElementById('monthAvgResult');
    const mMed = document.getElementById('monthMedResult');
    if (mAvg) mAvg.innerText = getAverage(filtered) + ' kg';
    if (mMed) mMed.innerText = getMedian(filtered) + ' kg';
  }

  function calculateCustomRange() {
    const f = document.getElementById('customFrom').value, t = document.getElementById('customTo').value;
    if (!f || !t) return;
    const from = parseLocalDate(f), to = parseLocalDate(t); from.setHours(0,0,0,0); to.setHours(23,59,59,999);
    const filtered = weightData.filter(d => { const dt = parseLocalDate(d.date); return dt >= from && dt <= to; }).map(d => d.weight);
    const cAvg = document.getElementById('customAvgResult');
    const cMed = document.getElementById('customMedResult');
    const cCnt = document.getElementById('customCountResult');
    if (cAvg) cAvg.innerText = getAverage(filtered) + ' kg';
    if (cMed) cMed.innerText = getMedian(filtered) + ' kg';
    if (cCnt) cCnt.innerText = filtered.length;
  }

  function renderCalendar() {
    const title = document.getElementById('calendarMonthTitle'), grid = document.getElementById('calendarDaysGrid'), info = document.getElementById('calendarSelectedInfo');
    if (!grid) return;
    grid.innerHTML = ''; info.style.display = 'none';
    const y = currentCalendarDate.getFullYear(), m = currentCalendarDate.getMonth();
    title.innerText = `${["Styczeń", "Luty", "Marzec", "Kwiecień", "Maj", "Czerwiec", "Lipiec", "Sierpień", "Wrzesień", "Październik", "Listopad", "Grudzień"][m]} ${y}`;
    
    const firstDay = (new Date(y, m, 1).getDay() || 7) - 1;
    const totalDays = new Date(y, m + 1, 0).getDate();
    const map = {};
    workoutData.forEach(w => { if(w.date) { const iso = formatDateISO(parseLocalDate(w.date)); if(!map[iso]) map[iso] = []; map[iso].push(w); } });

    for (let i = 0; i < firstDay; i++) {
      const ed = document.createElement('div'); ed.className = 'calendar-day empty'; grid.appendChild(ed);
    }
    for (let day = 1; day <= totalDays; day++) {
      const iso = formatDateISO(new Date(y, m, day));
      const dayDiv = document.createElement('div'); dayDiv.className = 'calendar-day';
      if (iso === formatDateISO(new Date())) dayDiv.classList.add('today');
      if (map[iso]) {
        dayDiv.classList.add('workout-day');
        dayDiv.innerHTML = `<span>${day}</span><span class="workout-badge">🏋️</span>`;
        dayDiv.onclick = () => {
          let html = `<strong style="color:var(--primary)">📅 ${formatDate(iso)}:</strong><ul style="margin:4px 0 0 16px; padding:0;">`;
          map[iso].forEach(i => {
            const seriesSummary = (i.weights || []).map((w, idx) => `${w} kg x ${formatReps(i.reps && i.reps[idx] ? i.reps[idx] : 8)}`).join(', ');
            html += `<li><strong>${i.exercise}:</strong> ${seriesSummary}</li>`;
          });
          info.innerHTML = html + `</ul>`; info.style.display = 'block';
        };
      } else { dayDiv.innerText = day; }
      grid.appendChild(dayDiv);
    }
  }

  async function saveEditedWeight(id) {
    const date = document.getElementById(`edit_w_date_${id}`).value;
    const weight = parseFloat(document.getElementById(`edit_w_val_${id}`).value);
    if (!date || isNaN(weight)) return;
    await window.firebaseFunctions.updateData('Waga', id, { Data: date, Waga: weight });
    await fetchFromFirebaseFast();
  }

  async function saveEditedWorkout(id, exercise) {
    const date = document.getElementById(`edit_wo_date_${id}`).value;
    const weightsStr = document.getElementById(`edit_wo_weights_${id}`).value;
    const repsStr = document.getElementById(`edit_wo_reps_${id}`).value;
    const weights = weightsStr.split(',').map(w => parseFloat(w.trim().replace(',', '.'))).filter(v => !isNaN(v));
    const reps = repsStr.split(',').map(r => parseInt(r.trim())).filter(v => !isNaN(v));
    if (!date || weights.length === 0) return;
    await window.firebaseFunctions.updateData('Treningi', id, { Data: date, Cwiczenie: exercise, Wagi: weights, Powtorzenia: reps });
    await fetchFromFirebaseFast();
  }

  async function saveEditedBody(id, part) {
    const date = document.getElementById(`edit_b_date_${id}`).value;
    const size = parseFloat(document.getElementById(`edit_b_val_${id}`).value);
    if (!date || isNaN(size)) return;
    await window.firebaseFunctions.updateData('Obwody', id, { Data: date, Partia: part, Wymiar: size });
    await fetchFromFirebaseFast();
  }

  async function deleteRecord(coll, id) {
    if(!confirm("Usunąć wpis?")) return;
    await window.firebaseFunctions.deleteData(coll, id);
    await fetchFromFirebaseFast();
  }

  function saveNewPin() {
    const val = document.getElementById('newPinInput').value.trim();
    if (val.length !== 4 || isNaN(val)) { alert("PIN musi składać się z 4 cyfr!"); return; }
    localStorage.setItem('settings_pin', val);
    alert("Zapisano nowy PIN!");
    document.getElementById('newPinInput').value = '';
  }

  function clearPinProtection() {
    localStorage.removeItem('settings_pin');
    sessionStorage.removeItem('app_authenticated');
    alert("Zabezpieczenie PIN zostało zresetowane do domyślnego (1234), a wylogowanie z sesji wyczyszczone.");
  }

  function getCssColor(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

  function drawNativeChart() { drawChart('nativeChart', weightData.map(d => d.weight), currentChartRange, 'kg'); }
  function drawWorkoutChart() {
    const sel = document.getElementById('statExerciseSelect');
    if (!sel || !sel.value) return;
    drawChart('workoutChart', workoutData.filter(w => w.exercise === sel.value).map(w => w.avgWeight), currentWorkoutChartRange, 'kg');
  }
  function drawBodyChart() {
    const sel = document.getElementById('statBodySelect');
    if (!sel || !sel.value) return;
    drawChart('bodyChart', bodyMeasurementsData.filter(b => b.part === sel.value).map(b => b.size), currentBodyChartRange, 'cm');
  }

  function drawChart(canvasId, values, range, unit) {
    const canvas = document.getElementById(canvasId); if (!canvas || !canvas.parentElement.clientWidth) return;
    const ctx = canvas.getContext('2d'); canvas.width = canvas.parentElement.clientWidth - 28; canvas.height = 180;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let vals = [...values].filter(v => !isNaN(v));
    if (range !== 'all' && vals.length > parseInt(range)) vals = vals.slice(-parseInt(range));
    if (vals.length < 2) {
      ctx.fillStyle = getCssColor('--text-muted'); ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Za mało danych', canvas.width / 2, canvas.height / 2); return;
    }
    const pad = 30, min = Math.max(0, Math.min(...vals) - 1), max = Math.max(...vals) + 1;
    const getX = i => pad + (i / (vals.length - 1)) * (canvas.width - 2 * pad);
    const getY = v => canvas.height - pad - ((v - min) / (max - min)) * (canvas.height - 2 * pad);

    ctx.strokeStyle = getCssColor('--primary'); ctx.lineWidth = 3; ctx.beginPath();
    vals.forEach((v, i) => i === 0 ? ctx.moveTo(getX(i), getY(v)) : ctx.lineTo(getX(i), getY(v))); ctx.stroke();
    ctx.fillStyle = getCssColor('--primary');
    vals.forEach((v, i) => {
      ctx.beginPath(); ctx.arc(getX(i), getY(v), 3.5, 0, Math.PI * 2); ctx.fill();
    });
  }
</script>
