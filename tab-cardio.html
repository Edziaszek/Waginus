<div class="card">
  <h2>🏃‍♂️ Dodaj Trening Kardio</h2>
  <form id="cardioForm">
    <div class="form-field"><label>Data</label><input type="date" id="cardioDate" required></div>
    <div class="form-field">
      <label>Rodzaj aktywności / Urządzenie</label>
      <select id="cardioTypeSelect" required><option value="">Wybierz aktywność...</option></select>
    </div>
    <div class="form-field">
      <label>Czas treningu (GG:MM:SS)</label>
      <div class="time-row">
        <div class="unit-field"><input type="number" id="cardioH" min="0" max="99" step="1" inputmode="numeric" value="0" aria-label="Godziny" required><i>g</i></div>
        <div class="unit-field"><input type="number" id="cardioM" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="Minuty" required><i>min</i></div>
        <div class="unit-field"><input type="number" id="cardioS" min="0" max="59" step="1" inputmode="numeric" value="0" aria-label="Sekundy" required><i>s</i></div>
      </div>
    </div>
    <div class="form-field">
      <label>Dystans</label>
      <div class="unit-field"><input type="number" id="cardioDistance" step="0.01" inputmode="decimal" placeholder="np. 5.2" required><i>km</i></div>
    </div>
    <div class="form-field">
      <label>Średnie tętno</label>
      <div class="unit-field"><input type="number" id="cardioHeartRate" step="1" inputmode="numeric" placeholder="np. 145" required><i>bpm</i></div>
    </div>
    <div class="stat-box"><div class="stat-lbl">Średnie tempo (liczone automatycznie)</div><div class="stat-val" id="cardioPacePreview">-</div></div>
    <button type="submit" class="btn-primary">Zapisz Kardio</button>
  </form>
</div>

<div class="card">
  <h2>📊 Statystyki Kardio</h2>
  <div class="form-field">
    <label>Wybierz aktywność</label>
    <select id="statCardioSelect"><option value="">Wybierz aktywność...</option></select>
  </div>
  <div class="segmented" role="group" id="cardioFilterGroup">
    <button type="button" class="active" data-filter="week" aria-pressed="true">Tydzień</button>
    <button type="button" data-filter="month" aria-pressed="false">Miesiąc</button>
    <button type="button" data-filter="90" aria-pressed="false">90 dni</button>
    <button type="button" data-filter="all" aria-pressed="false">Wszystko</button>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-lbl">Łączny dystans</div><div class="stat-val" id="cardioDistTotal">-</div></div>
    <div class="stat-box"><div class="stat-lbl">Łączny czas</div><div class="stat-val" id="cardioTimeTotal">-</div></div>
  </div>
  <div class="chart-box"><canvas id="cardioChart"></canvas></div>
</div>

<div class="card">
  <h2>📜 Historia Kardio</h2>
  <div id="cardioHistory" class="history"></div>
</div>

<script>
(() => {
  const { util: U, data: D } = App;
  const $ = id => document.getElementById(id);
  const state = { filter: 'week' };

  // ---------- dane ----------
  function parse(raw) {
    D.cardioTypes = raw.KardioTypy
      .map(i => ({
        id: i.id, name: String(U.pick(i, 'Nazwa', 'Typ', 'type') ?? '').trim(),
        // mięśnie zapisane w bazie: główne (Miesnie) i pomocnicze (MiesnieDodatkowe) – pokazują się na manekinie
        muscles: Array.isArray(i.Miesnie) ? i.Miesnie.filter(x => typeof x === 'string') : [],
        muscles2: Array.isArray(i.MiesnieDodatkowe) ? i.MiesnieDodatkowe.filter(x => typeof x === 'string') : []
      })).filter(t => t.name);
    if (!D.cardioTypes.length) D.cardioTypes = ['Bieżnia', 'Rowerek', 'Orbitrek', 'Spacer'].map((name, i) => ({ id: 'default_' + i, name, muscles: [], muscles2: [] }));

    D.cardio = raw.Kardio.map(i => {
      const date = U.pick(i, 'Data', 'date') || '', rawTime = String(U.pick(i, 'Czas', 'duration') ?? '');
      const secs = U.parseDuration(rawTime), distance = U.num(U.pick(i, 'Dystans', 'distance')) || 0;
      return {
        id: i.id, date, ts: U.ts(date),
        duration: secs > 0 ? U.fmtDuration(secs) : rawTime,                 // starsze zapisy pokazujemy jako GG:MM:SS
        type: U.pick(i, 'Typ', 'type') || 'Bieżnia',
        distance,
        pace: U.pace(secs, distance) || String(U.pick(i, 'Tempo', 'pace') ?? ''),   // tempo zawsze z czasu i dystansu
        heartRate: parseInt(U.pick(i, 'Tetno', 'heartRate')) || 0
      };
    }).filter(r => r.date && !isNaN(r.ts)).sort(U.byTs);
  }

  function fillSelects() {
    const opts = '<option value="">Wybierz aktywność...</option>' +
      D.cardioTypes.map(t => `<option value="${U.esc(t.name)}">${U.esc(t.name)}</option>`).join('');
    for (const id of ['cardioTypeSelect', 'statCardioSelect']) {
      const el = $(id), cur = el.value;
      el.innerHTML = opts;
      el.value = cur;
      if (el.selectedIndex < 0) el.selectedIndex = 0;
      if (id === 'statCardioSelect' && el.selectedIndex === 0 && D.cardioTypes.length) el.selectedIndex = 1;
    }
  }

  // ---------- statystyki i wykres ----------
  function sessions() {
    const type = $('statCardioSelect').value.toLowerCase();
    if (!type) return [];
    const n = new Date(), f = state.filter;
    const from = f === 'week' ? U.daysAgo((n.getDay() || 7) - 1)
      : f === 'month' ? new Date(n.getFullYear(), n.getMonth(), 1).getTime()
      : f === '90' ? U.daysAgo(90) : 0;
    return D.cardio.filter(c => c.ts >= from && c.type.toLowerCase() === type);
  }

  // Wykres kardio: słupki dystansu na sesję (ostatnie 40), wartości nad słupkami gdy jest ich mało
  function drawChart(rows) {
    const canvas = $('cardioChart'), w = canvas.parentElement.clientWidth;
    if (!w) return;
    const h = 180, dpr = window.devicePixelRatio || 1, ctx = canvas.getContext('2d');
    canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    const c = { bar: U.css('--primary'), muted: U.css('--text-muted'), grid: U.css('--card-border') };
    ctx.font = '11px sans-serif'; ctx.fillStyle = c.muted;
    rows = rows.slice(-40);
    if (!rows.length) { ctx.textAlign = 'center'; ctx.fillText('Brak sesji w okresie', w / 2, h / 2); return; }

    const P = 12, T = 20, B = 24, max = Math.max(...rows.map(r => r.distance)) * 1.1 || 1;
    const slot = (w - 2 * P) / rows.length, bw = Math.min(32, slot * .7);

    ctx.strokeStyle = c.grid; ctx.beginPath(); ctx.moveTo(P, h - B); ctx.lineTo(w - P, h - B); ctx.stroke();
    ctx.textAlign = 'center';
    rows.forEach((r, i) => {
      const bh = r.distance / max * (h - T - B), x = P + slot * i + (slot - bw) / 2, y = h - B - bh;
      ctx.fillStyle = c.bar; ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 3); ctx.fill();
      if (rows.length <= 10) { ctx.fillStyle = c.muted; ctx.textBaseline = 'bottom'; ctx.fillText(+r.distance.toFixed(1), x + bw / 2, y - 3); }
    });
    ctx.fillStyle = c.muted; ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText(U.fmtDate(rows[0].date).slice(0, 5), P, h - B + 6);
    ctx.textAlign = 'right'; ctx.fillText(U.fmtDate(rows[rows.length - 1].date).slice(0, 5), w - P, h - B + 6);
  }

  function renderStats() {
    const rows = sessions();
    const km = rows.reduce((s, r) => s + r.distance, 0), min = rows.reduce((s, r) => s + (U.parseDuration(r.duration) || 0), 0) / 60;
    $('cardioDistTotal').textContent = km.toFixed(2) + ' km';
    $('cardioTimeTotal').textContent = min >= 60 ? `${Math.floor(min / 60)}h ${Math.round(min % 60)} min` : Math.round(min) + ' min';
    drawChart(rows);
  }

  function renderHistory() {
    const groups = [...U.group(D.cardio, c => U.fmtDate(c.date))].reverse();
    $('cardioHistory').innerHTML = groups.map(([dt, items], idx) => `
      <details class="accordion" ${idx === 0 ? 'open' : ''}>
        <summary><span>📅 ${dt} (${items.length})</span></summary>
        <div class="accordion-body">${items.map(i => `
          <div class="data-item">
            <div><strong>${U.esc(i.type)}</strong><br>
              <small class="muted">Czas: ${U.esc(i.duration)} | Tempo: ${U.esc(i.pace || '-')} min/km | Tętno: ${i.heartRate} bpm</small></div>
            <strong class="accent">${i.distance} km</strong>
          </div>`).join('')}</div>
      </details>`).join('') || '<div class="muted center">Brak wpisów kardio</div>';
  }

  function render() { fillSelects(); renderHistory(); renderStats(); }

  // ---------- zdarzenia ----------
  function init() {
    $('cardioDate').value = U.iso(Date.now());
    $('statCardioSelect').addEventListener('change', renderStats);
    $('cardioFilterGroup').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      $('cardioFilterGroup').querySelectorAll('button').forEach(x => { x.classList.toggle('active', x === b); x.setAttribute('aria-pressed', x === b); });
      state.filter = b.dataset.filter;
      renderStats();
    });

    // podgląd tempa na żywo
    const readTime = () => {
      const h = parseInt($('cardioH').value) || 0, m = parseInt($('cardioM').value) || 0, sec = parseInt($('cardioS').value) || 0;
      return { h, m, sec, total: h * 3600 + m * 60 + sec };
    };
    const updatePace = () => {
      const p = U.pace(readTime().total, U.num($('cardioDistance').value));
      $('cardioPacePreview').textContent = p ? p + ' min/km' : '-';
    };
    ['cardioH', 'cardioM', 'cardioS', 'cardioDistance'].forEach(id => $(id).addEventListener('input', updatePace));

    $('cardioForm').addEventListener('submit', async e => {
      e.preventDefault();
      const date = $('cardioDate').value, type = $('cardioTypeSelect').value;
      if (!date || !type) return;
      const t = readTime(), distance = U.num($('cardioDistance').value), heartRate = parseInt($('cardioHeartRate').value);
      if (t.m > 59 || t.sec > 59) return alert('Minuty i sekundy muszą mieścić się w zakresie 0–59.');
      if (!(t.total > 0)) return alert('Podaj czas treningu większy od zera.');
      if (!(distance > 0)) return alert('Podaj dystans większy od zera – na jego podstawie liczymy tempo.');
      const duration = U.fmtDuration(t.total), pace = U.pace(t.total, distance);
      const rec = { date, ts: U.ts(date), type, duration, distance, pace, heartRate };
      D.cardio.push(rec); D.cardio.sort(U.byTs); App.invalidate();
      const id = await App.run(
        () => App.db.addData('Kardio', { Data: date, Typ: type, Czas: duration, Dystans: distance, Tempo: pace, Tetno: heartRate }),
        () => U.drop(D.cardio, rec), e.submitter);
      if (id) {
        rec.id = id;
        ['cardioH', 'cardioM', 'cardioS'].forEach(k => { $(k).value = 0; });   // czyścimy formularz pod następny trening
        $('cardioDistance').value = ''; $('cardioHeartRate').value = ''; updatePace();
      }
    });
  }

  App.register('cardio', { collections: ['Kardio', 'KardioTypy'], parse, init, render });
})();
</script>
