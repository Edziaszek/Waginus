<div class="card"><h2>📊 Podsumowanie Formy</h2></div>

<div class="card">
  <h3>⚖️ Waga</h3>
  <div id="mainWeight" class="stack"></div>
</div>

<div class="card">
  <h3>📏 Obwody ciała</h3>
  <div id="mainBody" class="stack"></div>
</div>

<div class="card">
  <h3>🏋️ Rekordy i ostatnie ciężary w ćwiczeniach</h3>
  <div id="mainWorkout" class="stack"></div>
</div>

<script>
(() => {
  const { util: U, data: D } = App;
  const $ = id => document.getElementById(id);
  const empty = msg => `<div class="muted">${msg}</div>`;
  const repsAt = (w, i) => w.reps[i] || 8;

  function renderWeight() {
    const w = D.weight;
    if (!w.length) return ($('mainWeight').innerHTML = empty('Brak pomiarów wagi w bazie.'));
    const last7 = w.filter(r => r.ts >= U.daysAgo(6)).map(r => r.weight);
    const current = last7.length ? U.avg(last7) : w[w.length - 1].weight;
    const max = Math.max(...w.map(r => r.weight));
    $('mainWeight').innerHTML = `
      <div class="data-item"><span>Aktualna waga (średnia z 7 dni):</span><strong>${current.toFixed(1)} kg</strong></div>
      <div class="data-item"><span>Najwyższa waga w bazie:</span><strong>${max.toFixed(1)} kg</strong></div>
      <div class="data-item"><span>Aktualnie schudłeś:</span><strong class="accent">${(max - current).toFixed(1)} kg</strong></div>`;
  }

  function renderBody() {
    if (!D.bodyParts.length) return ($('mainBody').innerHTML = empty('Brak zdefiniowanych obwodów w bazie.'));
    const byPart = U.group(D.body, b => b.part.toLowerCase()); // jedno przejście zamiast filtra na każdą partię
    $('mainBody').innerHTML = D.bodyParts.map(p => {
      const m = byPart.get(p.name.toLowerCase()) || [];
      let last = '-', max = '-', diff = '-';
      if (m.length) {
        const l = m[m.length - 1].size, mx = Math.max(...m.map(x => x.size));
        last = l.toFixed(1) + ' cm'; max = mx.toFixed(1) + ' cm'; diff = (mx - l).toFixed(1) + ' cm';
      }
      return `<div class="data-item col">
        <div class="between"><strong>${U.esc(p.name)}</strong></div>
        <div class="between muted" style="font-size:.9em">
          <span>Ostatni: <strong>${last}</strong></span>
          <span>Najwyższy: <strong>${max}</strong></span>
          <span>Różnica: <strong class="accent">${diff}</strong></span>
        </div></div>`;
    }).join('');
  }

  function renderWorkouts() {
    if (!D.exercises.length) return ($('mainWorkout').innerHTML = empty('Brak zdefiniowanych ćwiczeń w bazie.'));
    const byEx = U.group(D.workouts, w => w.exercise.toLowerCase());
    $('mainWorkout').innerHTML = D.exercises.map(ex => {
      const list = byEx.get(ex.name.toLowerCase()) || [];
      let last = '-', record = '-';
      if (list.length) {
        const lw = list[list.length - 1];
        if (lw.weights.length) {
          const mx = Math.max(...lw.weights);
          last = `${mx} kg x ${U.reps(repsAt(lw, lw.weights.indexOf(mx)))}`;
        }
        let best = 0, bestReps = 8;
        for (const w of list) w.weights.forEach((kg, i) => { if (kg > best) { best = kg; bestReps = repsAt(w, i); } });
        if (best > 0) record = `${best} kg x ${U.reps(bestReps)}`;
      }
      return `<div class="data-item">
        <div><strong>${U.esc(ex.name)}</strong><br><small class="muted">Ostatnio: ${last}</small></div>
        <div style="text-align:right">Rekord: <strong class="accent">${record}</strong></div></div>`;
    }).join('');
  }

  App.register('main', {
    render() { renderWeight(); renderBody(); renderWorkouts(); }
  });
})();
</script>
