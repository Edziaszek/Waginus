<div class="card">
  <h2>Dodaj pomiar obwodu</h2>
  <form id="bodyForm">
    <div class="form-group">
      <div class="form-field"><label>Data</label><input type="date" id="bodyDate" required></div>
      <div class="form-field">
        <label>Partia Ciała (z Bazy)</label>
        <select id="bodySelect" required><option value="">Wybierz obwód...</option></select>
      </div>
    </div>
    <div class="form-field">
      <label>Wymiar (cm)</label>
      <div class="series-row">
        <button type="button" class="step-btn" data-step="-0.5">−</button>
        <input type="number" id="bodySizeInput" class="series-input" step="0.1" inputmode="decimal" value="80.0" required>
        <button type="button" class="step-btn" data-step="0.5">+</button>
      </div>
    </div>
    <button type="submit" class="btn-primary">Zapisz obwód</button>
  </form>
</div>

<div class="card">
  <h2>Statystyki obwodu</h2>
  <div class="form-field">
    <label>Wybierz partię ciała</label>
    <select id="statBodySelect"><option value="">Wybierz obwód...</option></select>
  </div>
  <div class="segmented" role="group" id="bodyPeriodGroup">
    <button type="button" data-period="7" aria-pressed="false">Tydzień</button>
    <button type="button" class="active" data-period="30" aria-pressed="true">Miesiąc</button>
    <button type="button" data-period="90" aria-pressed="false">3 Miesiące</button>
    <button type="button" data-period="all" aria-pressed="false">Wszystko</button>
  </div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-lbl">Najniższy</div><div class="stat-val" id="bodyMin">-</div></div>
    <div class="stat-box"><div class="stat-lbl">Najwyższy</div><div class="stat-val" id="bodyMax">-</div></div>
    <div class="stat-box"><div class="stat-lbl">Różnica</div><div class="stat-val" id="bodyDiff">-</div></div>
  </div>
</div>

<div class="card">
  <h2>Wykres postępu obwodu</h2>
  <div class="chart-box"><canvas id="bodyChart"></canvas></div>
</div>

<div class="card">
  <h2>Historia obwodów</h2>
  <div id="bodyHistory" class="history"></div>
</div>

<script>
(() => {
  const { util: U, data: D } = App;
  const $ = id => document.getElementById(id);
  const state = { period: '30' };

  // ---------- dane ----------
  // Partie ciała są definiowane przez dokumenty kolekcji Obwody (bez daty) oraz – dla starych danych – pole ObwodyBaza w Cwiczenia.
  // Każda partia pamięta ID swoich dokumentów, żeby ustawienia mogły ją poprawnie usunąć.
  function parse(raw) {
    const parts = new Map();
    const part = name => {
      const k = name.toLowerCase();
      if (!parts.has(k)) parts.set(k, { id: 'part_' + parts.size, name, docIds: [], legacyIds: [] });
      return parts.get(k);
    };
    raw.Cwiczenia.forEach(i => { const n = String(i.ObwodyBaza ?? '').trim(); if (n) part(n).legacyIds.push(i.id); });

    const items = raw.Obwody.map(i => {
      const name = String(U.pick(i, 'Partia', 'part', 'Part', 'name') ?? '').trim();
      if (name) part(name).docIds.push(i.id);
      return { i, name };
    });

    D.body = [];
    for (const { i, name: given } of items) {
      let name = given, date = U.pick(i, 'Data', 'date', 'data') || '';
      for (const [k, v] of Object.entries(i)) { // stare formaty: data jako klucz/wartość, partia jako dowolne pole
        if (k === 'id') continue;
        if (!date && (U.DATE_RE.test(k) || U.DATE_RE.test(v))) date = U.DATE_RE.test(k) ? k : v;
        if (!name && typeof v === 'string' && v.length > 1 && isNaN(v) && parts.has(v.toLowerCase())) name = v;
      }
      const size = U.num(U.pick(i, 'Wymiar', 'size', 'wymiar', 'Wartosc'));
      if (date && name && !isNaN(size)) D.body.push({ id: i.id, date, ts: U.ts(date), part: parts.get(name.toLowerCase()).name, size });
    }
    D.body.sort(U.byTs);
    D.bodyParts = [...parts.values()];
  }

  function fillSelects() {
    const opts = '<option value="">Wybierz obwód...</option>' +
      D.bodyParts.map(p => `<option value="${U.esc(p.name)}">${U.esc(p.name)}</option>`).join('');
    for (const id of ['bodySelect', 'statBodySelect']) {
      const el = $(id), cur = el.value;
      el.innerHTML = opts;
      el.value = cur;
      if (el.selectedIndex < 0) el.selectedIndex = 0;
      if (id === 'statBodySelect' && el.selectedIndex === 0 && D.bodyParts.length) el.selectedIndex = 1;
    }
  }

  // ---------- statystyki i wykres ----------
  function measurements() {
    const name = $('statBodySelect').value.toLowerCase();
    if (!name) return [];
    const from = state.period === 'all' ? 0 : U.daysAgo(+state.period);
    return D.body.filter(b => b.ts >= from && b.part.toLowerCase() === name);
  }

  // Wykres obwodu: linia z wypełnieniem pod spodem, podpisane minimum i maksimum
  function drawChart(rows) {
    const canvas = $('bodyChart'), w = canvas.parentElement.clientWidth;
    if (!w) return;
    const h = 180, dpr = window.devicePixelRatio || 1, ctx = canvas.getContext('2d');
    canvas.width = w * dpr; canvas.height = h * dpr; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    const c = { line: U.css('--primary'), muted: U.css('--text-muted') };
    ctx.font = '11px sans-serif'; ctx.fillStyle = c.muted;
    if (rows.length < 2) { ctx.textAlign = 'center'; ctx.fillText('Za mało danych w okresie', w / 2, h / 2); return; }

    const vals = rows.map(r => r.size), lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    const min = lo - span * .3, max = hi + span * .3, L = 36, R = 12, T = 12, B = 24;
    const X = i => L + i / (vals.length - 1) * (w - L - R);
    const Y = v => T + (1 - (v - min) / (max - min)) * (h - T - B);

    ctx.beginPath(); ctx.moveTo(X(0), h - B);
    vals.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
    ctx.lineTo(X(vals.length - 1), h - B); ctx.closePath();
    ctx.fillStyle = c.line; ctx.globalAlpha = .15; ctx.fill(); ctx.globalAlpha = 1;

    ctx.strokeStyle = c.line; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    vals.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v)));
    ctx.stroke();
    if (vals.length <= 40) { ctx.fillStyle = c.line; vals.forEach((v, i) => { ctx.beginPath(); ctx.arc(X(i), Y(v), 3, 0, 7); ctx.fill(); }); }

    ctx.fillStyle = c.muted; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(hi.toFixed(1), L - 6, Y(hi)); ctx.fillText(lo.toFixed(1), L - 6, Y(lo));
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText(U.fmtDate(rows[0].date).slice(0, 5), L, h - B + 6);
    ctx.textAlign = 'right'; ctx.fillText(U.fmtDate(rows[rows.length - 1].date).slice(0, 5), w - R, h - B + 6);
  }

  function renderStats() {
    const rows = measurements(), sizes = rows.map(r => r.size);
    const lo = Math.min(...sizes), hi = Math.max(...sizes); // dla pustej listy: Infinity/-Infinity -> "-"
    $('bodyMin').textContent = U.f1(lo, 'cm');
    $('bodyMax').textContent = U.f1(hi, 'cm');
    $('bodyDiff').textContent = sizes.length ? U.f1(hi - lo, 'cm') : '-';
    drawChart(rows);
  }

  function renderHistory() {
    const groups = [...U.group(D.body, b => U.fmtDate(b.date))].reverse();
    $('bodyHistory').innerHTML = groups.map(([dt, items], idx) => `
      <details class="accordion" ${idx === 0 ? 'open' : ''}>
        <summary><span>📅 ${dt} (${items.length})</span></summary>
        <div class="accordion-body">${items.map(i =>
          `<div class="data-item"><span>${U.esc(i.part)}</span><strong>${i.size.toFixed(1)} cm</strong></div>`).join('')}</div>
      </details>`).join('') || '<div class="muted center">Brak pomiarów obwodów</div>';
  }

  function render() { fillSelects(); renderHistory(); renderStats(); }

  // ---------- zdarzenia ----------
  function init() {
    $('bodyDate').value = U.iso(Date.now());
    $('statBodySelect').addEventListener('change', renderStats);

    // po wybraniu partii podpowiedz ostatni pomiar
    $('bodySelect').addEventListener('change', () => {
      const name = $('bodySelect').value.toLowerCase();
      const last = name && D.body.findLast(b => b.part.toLowerCase() === name);
      if (last) $('bodySizeInput').value = last.size.toFixed(1);
    });

    $('bodyForm').addEventListener('click', e => {
      const b = e.target.closest('[data-step]');
      if (!b) return;
      const inp = $('bodySizeInput');
      inp.value = Math.max(0, (parseFloat(inp.value) || 0) + +b.dataset.step).toFixed(1);
    });

    $('bodyPeriodGroup').addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      $('bodyPeriodGroup').querySelectorAll('button').forEach(x => { x.classList.toggle('active', x === b); x.setAttribute('aria-pressed', x === b); });
      state.period = b.dataset.period;
      renderStats();
    });

    $('bodyForm').addEventListener('submit', async e => {
      e.preventDefault();
      const date = $('bodyDate').value, part = $('bodySelect').value, size = U.num($('bodySizeInput').value);
      if (!date || !part || isNaN(size)) return;
      const rec = { date, ts: U.ts(date), part, size };
      D.body.push(rec); D.body.sort(U.byTs); App.invalidate();
      const id = await App.run(() => App.db.addData('Obwody', { Data: date, Partia: part, Wymiar: size }), () => U.drop(D.body, rec), e.submitter);
      if (id) {
        rec.id = id;
        D.bodyParts.find(p => p.name === part)?.docIds.push(id); // żeby usunięcie partii objęło też ten pomiar
      }
    });
  }

  App.register('body', { collections: ['Obwody', 'Cwiczenia'], parse, init, render });
})();
</script>
